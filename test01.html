div class=\"ohi\">III A-29</div>","<div class=\"ohi\">II B-33</div>"],1],["<div class=\"qhi\"><strong>The colossal Varaha sculpture at Eran is an outstanding example of the art of which period?</strong></div>",["<div class=\"ohi\">Mauryan Period</div>","<div class=\"ohi\">Shunga Period</div>","<div class=\"ohi\">Gupta Period</div>","<div class=\"ohi\">Kushan Period</div>"],2],["<div class=\"qhi\"><strong>The earliest epigraphic evidence of the practice of Sati in India has been found at which site?</strong></div>",["<div class=\"ohi\">Sanchi</div>","<div class=\"ohi\">Eran</div>","<div class=\"ohi\">Vidisha</div>","<div class=\"ohi\">Ujjain</div>"],1],["<div class=\"qhi\"><strong>The Bhimbetka Rock Shelters are located in which mountain range?</strong></div>",["<div class=\"ohi\">Vindhya</div>","<div class=\"ohi\">Satpura</div>","<div class=\"ohi\">Aravalli</div>","<div class=\"ohi\">Maikal</div>"],0],["<div class=\"qhi\"><strong>Which colour was used most extensively in the rock paintings of Bhimbetka?</strong></div>",["<div class=\"ohi\">Green</div>","<div class=\"ohi\">Yellow</div>","<div class=\"ohi\">Red</div>","<div class=\"ohi\">Blue</div>"],2],["<div class=\"qhi\"><strong>The red colour used in the Bhimbetka rock paintings was mainly obtained from which mineral?</strong></div>",["<div class=\"ohi\">Hematite</div>","<div class=\"ohi\">Manganese</div>","<div class=\"ohi\">Limestone</div>","<div class=\"ohi\">Copper</div>"],0],["<div class=\"qhi\"><strong>Navdatoli, Maheshwar and Raverkhedi are archaeological sites associated with which river valley?</strong></div>",["<div class=\"ohi\">Chambal Valley</div>","<div class=\"ohi\">Narmada Valley</div>","<div class=\"ohi\">Son Valley</div>","<div class=\"ohi\">Betwa Valley</div>"],1],["<div class=\"qhi\"><strong>The human fossil discovered at Hathnora is popularly known as:</strong></div>",["<div class=\"ohi\">Homo erectus</div>","<div class=\"ohi\">Narmada Man</div>","<div class=\"ohi\">Ramapithecus</div>","<div c function bilingualOption(x){
  const m=x.match(/<div class="ohi">([\s\S]*?)<\/div><div class="oen">([\s\S]*?)<\/div>/);
  if(!m){const s=x.match(/<div class="ohi">([\s\S]*?)<\/div>/);return s?s[1]:x;}
  const hi=m[1].trim(), en=m[2].trim();
  if(hi===en)return hi;
  const hn=(hi.match(/[0-9][0-9,]*(?:\.[0-9]+)?/g)||[]).join("|");
  const enN=(en.match(/[0-9][0-9,]*(?:\.[0-9]+)?/g)||[]).join("|");
  if(hn && hn===enN){
    const units=[["करोड़","crore"],["प्रतिशत","percent"],["लाख","lakh"],["वर्ष","year"]];
    for(const u of units){
      if(hi.endsWith(u[0]) && en.toLowerCase().endsWith(u[1])) return hi+" / "+u[1];
    }
    return hi+" / "+en;
  }
  return '<div class="ohi">'+hi+'</div><div class="oen">'+en+'</div>';
}
function render(){document.getElementById("counter").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("pct").textContent=Math.round((i+1)/qs.length*100)+"%";document.getElementById("question").innerHTML=qs[i][0].replace(/<div class="qhi">([\s\S]*?)<\/div>/,"<div class=\"qhi\" style=\"font-weight:900 !important;\">$1</div>");document.getElementById("options").innerHTML=qs[i][1].map((x,j)=>{x=bilingualOption(x);let cls="opt";if(ans[i]!==null){if(j===qs[i][2])cls+=" correct";if(j===ans[i]&&j!==qs[i][2])cls+=" wrong";if(j===ans[i])cls+=" selected"}else if(ans[i]===j)cls+=" selected";return '<button class="'+cls+'" onclick="pick('+j+')" '+(ans[i]!==null?"disabled":"")+'><span style="font-weight:700">'+String.fromCharCode(65+j)+'.</span> '+x+'</button>'}).join("");document.getElementById("palette").innerHTML=qs.map((_,j)=>'<button class="p '+(ans[j]!=null?'done ':'')+(j===i?'current':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join("")}
function pick(j){if(stopped||ans[i]!==null)return;ans[i]=j;render();showFeedback(j);if(i<qs.length-1){feedbackTimer=setTimeout(next,900)}else{feedbackTimer=setTimeout(()=>showFeedback(j,true),900)}}
function showFeedback(j,last=false){const f=document.getElementById("feedback");const correct=qs[i][2];f.classList.remove("hidden");f.innerHTML=j===correct?'<b style="color:#137333">✓ Correct Answer</b>':'<b style="color:#b3261e">✗ Incorrect</b><br>Correct answer: <b>'+String.fromCharCode(65+correct)+". "+qs[i][1][correct]+'</b>';if(last)f.innerHTML+='<br><br><button class="btn" onclick="submitTest()">Submit Test</button>'}function next(){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function go(j){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");i=j;render()}
function submitTest(){if(stopped)return;if(confirm("Submit Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);submitted=true;finish()}}function stopTest(){if(stopped||submitted)return;if(confirm("Stop Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);stopped=true;document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML="<h2>Test Stopped</h2><p>Test was stopped. Submit a test to save Wrong Questions.</p>";document.getElementById("quiz").classList.add("hidden")}}
function finish(){let c=0,w=0,b=0;ans.forEach((x,j)=>x==null?b++:x===qs[j][2]?c++:w++);let score=c*3-w;let h=JSON.parse(localStorage.getItem("mppsc_iq_history_test01")||"[]");h.unshift({date:new Date().toLocaleString(),score,c,w,b});localStorage.setItem("mppsc_iq_history_test01",JSON.stringify(h.slice(0,20)));let wrongIds=ans.map((x,j)=>x!=null&&x!==qs[j][2]?j:null).filter(x=>x!==null);let skippedIds=ans.map((x,j)=>x==null?j:null).filter(x=>x!==null);localStorage.setItem("mppsc_iq_wrong_test01",JSON.stringify(wrongIds));localStorage.setItem("mppsc_iq_skipped_test01",JSON.stringify(skippedIds));localStorage.setItem("mppsc_iq_submitted_test01","1");document.getElementById("quiz").classList.add("hidden");document.getElementById("feedback").classList.add("hidden");const r=document.getElementById("result");r.classList.remove("hidden");r.innerHTML='<h2>Test Submitted</h2><div class="score">'+score+' Marks</div><div class="grid2"><div class="mini">Correct<br><b>'+c+'</b></div><div class="mini">Wrong<br><b>'+w+'</b></div><div class="mini">Skipped<br><b>'+b+'</b></div><div class="mini">Total Questions<br><b>'+qs.length+'</b></div></div><p><b>Score = (Correct × 3) − Wrong</b></p>'}
function show(x){quiz.classList.remove("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.add("hidden")}
function wrong(){quiz.classList.add("hidden");result.classList.add("hidden");notesView.classList.add("hidden");wrongView.classList.remove("hidden");let ids=JSON.parse(localStorage.getItem("mppsc_iq_wrong_test01")||"[]");let sk=JSON.parse(localStorage.getItem("mppsc_iq_skipped_test01")||"[]");let all=[...ids.map(j=>({j,t:"Wrong"})),...sk.map(j=>({j,t:"Skipped"}))].sort((a,b)=>a.j-b.j);wrongView.innerHTML="<h2>Wrong / Skipped Questions</h2>"+(all.length?all.map(o=>'<div class="wrong"><b>Q'+(o.j+1)+' — '+o.t+'</b><br>'+qs[o.j][0]+'<br><small>Correct answer: <b>'+String.fromCharCode(65+qs[o.j][2])+'. '+bilingualOption(qs[o.j][1][qs[o.j][2]])+'</b></small></div>').join(""):"<p>No wrong or skipped questions.</p>")}
function notes(){quiz.classList.add("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.remove("hidden");notesView.innerHTML="<h2>Notes — One Liner Facts</h2>"+qs.map((q,j)=>{let qt=q[0].replace(/<[^>]+>/g,"").trim();let a=bilingualOption(q[1][q[2]]).replace(/<[^>]+>/g,"").trim();return '<div class="mini" style="text-align:left"><b>'+(j+1)+'.</b> '+qt+' → <b>'+a+'</b></div>'}).join("")}
setInterval(()=>{if(sec>0&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!stopped){submitted=true;finish()}},1000);
