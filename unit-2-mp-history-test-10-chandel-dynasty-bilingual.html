const L=['A','B','C','D'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
document.getElementById('notes').innerHTML=DATA.map(x=>'<article class="card" data-q="'+x.n+'"><div class="q"><span class="num">'+x.n+'</span><span class="q-hi">'+esc(x.q)+'</span><span class="q-en" style="display:none;font-weight:600;color:#475569;font-size:14px;line-height:1.55;margin:6px 0 10px">'+esc(x.en)+'</span></div>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+x.n+'" value="'+L[j]+'" onchange="chooseOption(this)"><b>'+L[j]+'.</b><span><span class="opt-hi">'+esc(o)+'</span><span class="opt-en" style="display:none;margin-left:5px;color:#475569">'+esc(x.oe[j])+'</span></span></label>').join('')+'<div class="ans" style="display:none">उत्तर: ('+L[x.a]+') '+esc(x.o[x.a])+'</div></article>').join('');
function chooseOption(input){let card=input.closest('.card');if(card.classList.contains('answered'))return;let item=DATA[+card.dataset.q-1],opts=card.querySelectorAll('.opt'),chosen=L.indexOf(input.value);card.classList.add('answered');opts.forEach((o,j)=>{o.classList.add('locked');let r=o.querySelector('input');r.disabled=true;if(j===item.a)o.classList.add('correct');if(j===chosen&&chosen!==item.a)o.classList.add('wrong')});let result=document.createElement('div');result.className='result '+(chosen===item.a?'right':'wrong');result.textContent=chosen===item.a?'✓ सही उत्तर / Correct answer':'✗ गलत उत्तर / Incorrect — सही उत्तर / Correct answer: '+L[item.a]+'. '+item.o[item.a]+' / '+item.oe[item.a];card.appendChild(result);let next=card.nextElementSibling;if(next)setTimeout(()=>window.scrollTo({top:next.getBoundingClientRect().top+window.pageYOffset-120,behavior:'smooth'}),150)}
function setLang(lang){let en=lang==='en';document.body.classList.toggle('english-mode',en);document.querySelectorAll('.q-en,.opt-en').forEach(el=>el.style.display=en?(el.classList.contains('q-en')?'block':'inline'):'none');document.querySelectorAll('.q-hi,.opt-hi').forEach(el=>el.style.display=en?'none':'');document.getElementById('hiBtn').classList.toggle('active',!en);document.getElementById('enBtn').classList.toggle('active',en);document.documentElement.lang=lang}
document.getElementById('hiBtn').onclick=()=>setLang('hi');document.getElementById('enBtn').onclick=()=>setLang('en');
document.getElementById('scoreBtn').onclick=()=>{let cards=document.querySelectorAll('#notes .card'),correct=0,wrong=0,attempted=0;cards.forEach(card=>{if(card.classList.contains('answered')){attempted++;if(card.querySelector('.result.right'))correct++;else wrong++}});let box=document.getElementById('scoreBox');box.textContent='स्कोर / Score: '+(correct*3-wrong)+' / '+(cards.length*3)+' | सही / Correct: '+correct+' | गलत / Wrong: '+wrong+' | प्रयास / Attempted: '+attempted;box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'center'})};
document.getElementById('refreshBtn').onclick=()=>{if(confirm('क्या टेस्ट दोबारा शुरू करें? / Restart test?'))location.reload()};
</script></body></html>
