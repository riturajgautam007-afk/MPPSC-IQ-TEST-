<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC IQ Telegram Test Sender</title>
<style>
body{font-family:Arial,sans-serif;max-width:600px;margin:30px auto;padding:20px;background:#f5f7fb}
.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}
input,textarea,button{width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
button{background:#1769aa;color:white;border:0;font-weight:700;cursor:pointer}
small{color:#667085}
#out{white-space:pre-wrap;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>📚 MPPSC IQ Test Sender</h2>
<p>Bot: <b>@MPPSC_IQ_Quiz_Bot</b></p>
<p><small>Bot Token इस page में save नहीं होता। Request सीधे Telegram Bot API को जाती है। Public page पर token इस्तेमाल करने की बजाय इसे अपने device पर local copy के रूप में चलाएँ।</small></p>

<label>Bot Token</label>
<input id="token" type="password" placeholder="अपना नया Bot Token डालें">

<label>Chat ID</label>
<input id="chat" placeholder="जैसे -1001234567890">

<label>Message</label>
<textarea id="msg" rows="7">📚 <b>MPPSC IQ TEST 01</b>

100 MCQs • +3 / −1 / 0
⏱️ समय: 60 मिनट

नीचे दिए बटन से टेस्ट शुरू करें 👇</textarea>

<button onclick="send()">🚀 TEST START Button भेजें</button>
<div id="out"></div>
</div>

<script>
async function send(){
 const token=document.getElementById('token').value.trim();
 const chat_id=document.getElementById('chat').value.trim();
 const text=document.getElementById('msg').value;
 const out=document.getElementById('out');

 if(!token||!chat_id){out.textContent='⚠️ Bot Token और Chat ID भरें।';return;}

 const payload={
  chat_id,
  text,
  parse_mode:'HTML',
  reply_markup:{
   inline_keyboard:[[
    {text:'🚀 TEST START करें',
     web_app:{url:'https://riturajgautam007-afk.github.io/MPPSC-IQ-TEST-/?v=60'}}
   ]]
  }
 };

 try{
  const res=await fetch('https://api.telegram.org/bot'+encodeURIComponent(token)+'/sendMessage',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(payload)
  });
  const data=await res.json();
  if(data.ok) out.textContent='✅ Message भेज दिया गया।';
  else out.textContent='❌ Telegram error: '+(data.description||'Unknown error');
 }catch(e){
  out.textContent='❌ Request failed: '+e.message;
 }
}
</script>
</body>
</html>
