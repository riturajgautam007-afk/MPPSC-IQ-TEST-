let i=0,ans=Array(qs.length).fill(null),sec=3600,submitted=false,stopped=false,feedbackTimer=null;

function sameSet(a,b){if(!Array.isArray(a))a=[a];return a.length===b.length&&a.slice().sort().join()==b.slice().sort().join()}

function pick(j){if(stopped||ans[i]!==null&&!Array.isArray(qs[i][2]))return;if(Array.isArray(qs[i][2])){let a=Array.isArray(ans[i])?ans[i].slice():[];a=a.includes(j)?a.filter(x=>x!==j):[...a,j];ans[i]=a;render();return}ans[i]=j;render();showFeedback(j);if(i<qs.length-1)feedbackTimer=setTimeout(next,900);else feedbackTimer=setTimeout(()=>showFeedback(j,true),900)}
function showFeedback(j,last=false){feedback.classList.remove("hidden");const ok=correctSet(qs[i]).includes(j);feedback.innerHTML=ok?'<b style="color:#137333">✓ Correct Answer</b>':'<b style="color:#b3261e">✗ Incorrect</b><br>Correct answer: <b>'+correctSet(qs[i]).map(k=>String.fromCharCode(65+k)+". "+qs[i][1][k]).join("<br>")+"</b>";if(last)feedback.innerHTML+="<br><br><button class=\"btn\" onclick=\"submitTest()\">Submit Test</button>"}
function next(){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}feedback.classList.add("hidden");if(i<qs.length-1){if(Array.isArray(qs[i][2])&&ans[i]!==null){render();}i++;render()}}
function prev(){if(i>0){i--;render()}}
function go(j){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}feedback.classList.add("hidden");i=j;render()}
function submitTest(){if(submitted||stopped)return;if(confirm("Submit Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);submitted=true;finish()}}

function finish(){let c=0,w=0,b=0;ans.forEach((x,j)=>{if(x==null||(Array.isArray(x)&&x.length===0))b++;else sameSet(x,correctSet(qs[j]))?c++:w++});let score=c*3-w;localStorage.setItem("mppsc_iq_wrong_pyq_test01",JSON.stringify(ans.map((x,j)=>x!=null&&!sameSet(x,correctSet(qs[j]))?j:null).filter(x=>x!==null)));localStorage.setItem("mppsc_iq_skipped_pyq_test01",JSON.stringify(ans.map((x,j)=>(x==null||(Array.isArray(x)&&x.length===0))?j:null).filter(x=>x!==null)));quiz.classList.add("hidden");feedback.classList.add("hidden");result.classList.remove("hidden");result.innerHTML="<h2>Test Submitted</h2><div class=\"score\">"+score+" Marks</div><div class=\"grid2\"><div class=\"mini\">Correct<br><b>"+c+"</b></div><div class=\"mini\">Wrong<br><b>"+w+"</b></div><div class=\"mini\">Skipped<br><b>"+b+"</b></div><div class=\"mini\">Total Questions<br><b>"+qs.length+"</b></div></div>"}

function wrong(){quiz.classList.add("hidden");result.classList.add("hidden");notesView.classList.add("hidden");wrongView.classList.remove("hidden");document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===1));let a=JSON.parse(localStorage.getItem("mppsc_iq_wrong_pyq_test01")||"[]").map(j=>({j,t:"Wrong"})),b=JSON.parse(localStorage.getItem("mppsc_iq_skipped_pyq_test01")||"[]").map(j=>({j,t:"Skipped"})),all=[...a,...b].sort((x,y)=>x.j-y.j);wrongView.innerHTML="<h2>Wrong / Skipped Questions</h2>"+(all.length?all.map(o=>'<div class="wrong"><b>Q'+(o.j+1)+" — "+o.t+"</b><br>"+qs[o.j][0]+"<br><small>Correct answer: <b>"+correctSet(qs[o.j]).map(k=>String.fromCharCode(65+k)+". "+qs[o.j][1][k]).join(" | ")+"</b></small></div>").join(""):"<p>No wrong or skipped questions.</p>")}
function notes(){quiz.classList.add("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.remove("hidden");document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===2));notesView.innerHTML="<h2>Notes — One Liner Facts</h2>"+qs.map((q,j)=>'<div class="mini" style="text-align:left"><b>'+(j+1)+".</b> "+q[0]+" → <b>"+correctSet(q).map(k=>q[1][k]).join(" / ")+"</b></div>").join("")}
setInterval(()=>{if(sec>0&&!submitted&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!submitted&&!stopped){submitted=true;finish()}},1000);
render();try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script></body></html>
