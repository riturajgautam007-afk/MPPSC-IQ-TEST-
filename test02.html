*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}header{background:#0b1f3a;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}.wrap{max-width:760px;margin:auto;padding:10px 12px 30px}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 3px 14px #0001}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#eef3f9;border-radius:10px;text-align:center;padding:9px;font-size:12px}.stat b{display:block;font-size:17px;margin-top:3px}.timer{color:#a11}.qtop{display:flex;justify-content:space-between;font-weight:700}.q{font-size:17px;line-height:1.55;margin:12px 0}.opt{width:100%;padding:13px;margin:6px 0;border:1px solid #d7deea;border-radius:10px;background:#fff;text-align:left;font-size:15px}.opt.selected{border:2px solid #0b1f3a;background:#edf3fb}.opt.correct{border:2px solid #218739;background:#e8f5e9;color:#146c2e}.opt.wrong{border:2px solid #d93025;background:#fdecea;color:#b3261e}.nav{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#0b1f3a;color:#fff;font-weight:700}.btn.alt{background:#e8edf4;color:#172033}.btn.stop{background:#8d1d1d}.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.p{aspect-ratio:1;border:0;border-radius:7px;background:#e7ecf3}.p.done{background:#0b1f3a;color:#fff}.p.current{outline:2px solid #c69b3c}.hidden{display:none}.score{font-size:32px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f1f4f8;padding:10px;border-radius:9px;text-align:center;margin:5px 0}.wrong{border-left:4px solid #9b1c1c;padding:10px;background:#fff5f5;margin:7px 0}.tabs{display:flex;gap:7px;overflow:auto}.tab{padding:9px 12px;border:0;border-radius:9px;background:#e7ecf3}.tab.active{background:#0b1f3a;color:#fff}</style></head><body>

<script>
const qs=[["The culture of tombs made of huge stone blocks in South India is known as the 'Megalithic' or Megalithic Culture. From which districts of Madhya Pradesh have its evidences been found?",["Indore and Ujjain","Sidhi and Seoni","Gwalior and Morena","Sagar and Damoh"],1],["Which of the following pairs regarding archaeological surveyors in different valleys of Madhya Pradesh is NOT correctly matched?",["Narmada Valley – H. D. Sankalia, R. V. Joshi","Chambal Valley – V. S. Wakankar, A. K. Shrivastava","Son Valley – Nisar Ahmad","Betwa Valley – B. B. Lal"],3],["The Bhimbetka (Raisen) archaeological site was discovered in 1957–58 by whom?",["Dr. H. D. Sankalia","V. S. Wakankar","Manoranjan Ghosh","G. R. Sharma"],1],["Select the correct statement regarding the 'Kayatha' (Ujjain) archaeological site:",["It was discovered by Manoranjan Ghosh in 1920.","It is the first Neolithic site discovered in Madhya Pradesh.","It was discovered by V. S. Wakankar in 1965 and is a Chalcolithic site.","Only Buddhist-period evidence has been found here."],2],["Match the following ancient texts with the historical facts mentioned in them: (a) Kaushitaki Upanishad (b) Shatapatha Brahmana (c) Aitareya Brahmana; (1) Mention of the Revottara (Narmada) River (2) Residence of the 50 cursed sons of Vishwamitra in Malwa (3) Mention of the Vindhya Mountains of Madhya Pradesh",["a-3, b-1, c-2","a-1, b-2, c-3","a-2, b-3, c-1","a-3, b-2, c-1"],0],["Which Ikshvaku ruler of Ayodhya sent his son Purukutsa to assist the Naga rulers of the Karkotaka dynasty ruling on the banks of the Narmada?",["King Muchukunda","King Mandhata","King Harishchandra","King Bhagiratha"],1],["The Ikshvaku ruler Purukutsa renamed Reva as which of the following?",["Chambal","Betwa","Narmada","Tapti"],2],["Match the following mythological sites/ashrams with their corresponding places in Madhya Pradesh: (a) Ashram of Kapila Muni and Sage Markandeya — (1) Amarkantak (Anuppur) (b) Sandipani Ashram — (2) Ujjain (c) Dugad Ashram — (3) Khandwa (d) Tapasthali of Sage Rishyasringa — (4) Mandla",["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1"],0],["Consider the following statements regarding the Vaitihotra dynasty under the Avanti Mahajanapada: 1. The Vaitihotra dynasty was a branch of the Haihaya dynasty in the Avanti Mahajanapada. 2. The last ruler of this dynasty was Pradyota. Which of the above statement(s) is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],0],["Consider the following statements regarding Chandapradyota: 1. He was a contemporary of Buddha. 2. When Chandapradyota suffered from jaundice, King Bimbisara of Magadha sent his royal physician Jivaka to treat him. Which of the above statement(s) is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],2],["Which ruler of the Nanda dynasty incorporated Avanti into the Magadha Empire?",["Mahapadma Nanda","Nandivardhana","Shishunaga","Ghanananda"],2],["Select the incorrect statement regarding the Chedi Mahajanapada:",["It extended over the present-day Bundelkhand region.","It was founded by Chedi, a Yadava ruler of Vidarbha.","According to the Mahabharata, its capital was Shuktimati.","Sudharma was the ruler when the Anupa Janapada was established under the Chedi Mahajanapada."],3],["During the Mauryan period, for how many years did Emperor Ashoka serve as the Kumaramatya of the Avanti region?",["08 years","11 years","14 years","05 years"],1],["According to the Mahavamsa, Emperor Ashoka's wife 'Sri Devi' belonged to which caste or Shakya lineage?",["Shakya princess","Merchant's daughter","Kshatriya lineage","Deva clan"],1],["With reference to Mauryan trade routes, the Uttarapatha route connected which two places?",["Pataliputra to Bharuch","Purushakotipura to Mathura","Tamralipti to Taxila","Vidisha to Ujjain"],1],["The 'Sonari Stupa' located in Raisen district of Madhya Pradesh was discovered by which archaeologist?",["Alexander Cunningham","John Marshall","H. D. Sankalia","V. S. Wakankar"],0],["'It was a training centre for followers of Buddhism.' This description is associated with which Mauryan-period stupa of Madhya Pradesh?",["Sanchi Stupa","Deorkothar Stupa","Sonari Stupa","Satdhara Stupa"],3],["Which Mauryan-period site of Madhya Pradesh is located at Teonthar in Rewa district, where three stupas were discovered during excavations in 1999–2000?",["Kasrawad","Deorkothar","Andher Stupa","Tumain Stupa"],1],["Emperor Ashoka's 'Gujjara Inscription' was discovered in which district of Madhya Pradesh?",["Datia","Sehore","Jabalpur","Sagar"],0],["In the 'Rupnath Inscription' found from Dehura Tehsil of Raisen district of Madhya Pradesh, how is Emperor Ashoka addressed?",["Maharajadhiraja","Buddha Shakya","Devanampiya Dassi","Magadharaja"],1],["Which statement is correct regarding the Buddhist archaeological site 'Saru-Maru' located in Sehore district of Madhya Pradesh?",["Ashoka's inscriptions have been found here.","The Saru-Maru caves are located here.","Both (A) and (B) are correct.","None of the above"],2],["After killing Brihadratha, the last ruler of the Maurya dynasty, Pushyamitra Shunga established the Shunga dynasty in 184 BCE. Where did he establish his capital?",["Ujjain","Pataliputra","Vidisha","Sanchi"],2],["According to the play 'Malavikagnimitram' written by Mahakavi Kalidasa, whom did Agnimitra, son of Pushyamitra Shunga, defeat and bring the ruler of Virakarma under his control?",["Kharavela","Menander","Yajnasena","Heliodorus"],2],["During the reign of the ninth Shunga ruler Bhagabhadra, Greek ambassador Heliodorus erected the 'Garuda Dhvaja' at Vidisha. Which religion greatly influenced him?",["Buddhism","Jainism","Bhagavata religion","Shaivism"],2],["According to the Buddhist text 'Dipavamsa', Emperor Ashoka was appointed governor of which province?",["Uttarapatha","Avanti","Taxila","Karnataka"],1],["From which city did Ashoka administer the Avanti province during the Mauryan period?",["Vidisha","Ujjain","Sanchi","Pataliputra"],1],["While serving as governor of Avantika, Ashoka suppressed a rebellion at which place?",["Ujjain","Taxila","Pataliputra","Kosala"],1],["Mauryan ruler Ashoka married which daughter of Vidisha?",["Padmavati","Mahadevi","Tisya","Devasena"],1],["Mahendra and Sanghamitra spread Buddhism in which country?",["Burma","Nepal","Sri Lanka","Bhutan"],2],["The dispatch of Mahendra and Sanghamitra to Sri Lanka is mentioned in which texts?",["Dipavamsa and Mahavamsa","Atthakatha","Milinda-Panha","Mahaparinibbana Sutta"],0],["The famous 'Vaishya Tekri' built by Mauryan ruler Ashoka is located in which city?",["Vidisha","Ujjain","Sanchi","Nageshwar"],1],["The original construction of the Sanchi Stupa was commissioned by which ruler?",["Pushyamitra Shunga","Ashoka","Agnimitra","Samudragupta"],1],["In which district is the Rupnath Inscription located?",["Sagar","Katni","Datia","Raisen"],1],["In which district is the Sanchi Inscription located?",["Raisen","Sagar","Vidisha","Chhindwara"],0],["In which district is the Kasrawad Inscription located?",["Khargone","Mandsaur","Shajapur","Neemuch"],0],["In which district is the Karitalai Inscription located?",["Sehore","Rewa","Katni","Damoh"],2],["From which of the following places have Mauryan-period coins NOT been found?",["Vidisha","Tripuri","Ujjain","Nagda"],3],["The Mauryan ruler Ashoka's wife, Vaishya Mahadevi, is mentioned in which text?",["Dipavamsa","Mahabodhivamsa","Mahavamsa","Ashokoddhesha"],1],["Mauryan ruler Samprati adopted Jainism under the influence of which Jain Acharya in Ujjain?",["Bhadrabahu","Suhastin","Sthulabhadra","Jinasena"],1],["Consider the following statements regarding the Gujjara Inscription: 1. The Gujjara Inscription is located in Datia district. 2. It mentions Ashoka by the name 'Devanampriya Ashoka.' Which of the above statement(s) is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],2],["In which inscriptions is the personal name 'Ashoka' found? 1. Maski 2. Nettur 3. Gujjara 4. Udegolam",["1, 2 and 3","1, 3 and 4","Only 1 and 2","Only 2 and 4"],1],["Consider the following statements regarding the Sanchi Inscription: 1. This inscription is located in Raisen district. 2. It contains an order by Ashoka to prevent the splitting of the Sangha. Which of the above statement(s) is/are correct?",["Only 1","Only 2","Both 1 and 2","None of these"],2],["In which district is the Tumain Stupa located?",["Sagar","Ashoknagar","Vidisha","Raisen"],1],["In which district is the Kasrawad Stupa located?",["Khargone","Dhar","Jhabua","Khandwa"],0],["In which district is the Deorkothar Stupa located?",["Shahdol","Rewa","Satna","Singrauli"],1],["In which district is the Bharhut Stupa located?",["Jabalpur","Rewa","Satna","Sagar"],2],["In which district is the Satdhara Stupa located?",["Raisen","Sagar","Vidisha","Jabalpur"],0],["In which district is the Andher Stupa located?",["Raisen","Dhar","Vidisha","Panna"],0],["In which district is the Sonari Stupa located?",["Vidisha","Sagar","Raisen","Khandwa"],2],["When was the Sanchi Stupa discovered?",["1805","1818","1834","1857"],1],["Who discovered the Sanchi Stupa?",["Cunningham","General Taylor","Marshall","Horne"],1],["The Great Stupa at Sanchi was constructed by whom?",["Pushyamitra Shunga","Ashoka","Kanishka","Nagarjuna"],1],["Whose relics are enshrined in the Sanchi Stupa?",["Buddha","Sariputra and Mahamoggallana","Nagarjuna","Ananda"],1],["Where are the relics obtained from Sanchi Stupa No. 3 currently preserved?",["Paris Museum","Varanasi Museum","London Museum","Colombo Museum"],2],["When were the Sanchi monuments included in the UNESCO World Heritage List?",["1980","1989","1993","1999"],1],["The gateways of the Sanchi Stupa were constructed during the reign of which ruler?",["Ashoka","Ajatashatru","Pushyamitra Shunga","Kanishka"],2],["Which place was declared the first 'Solar City' of Madhya Pradesh?",["Rewa","Mandsaur","Sanchi","Neemuch"],2],["Where was the first Rail Museum of Madhya Pradesh established?",["Gwalior","Itarsi","Sanchi","Jabalpur"],2],["In which district is the Bharhut Stupa located?",["Jabalpur","Rewa","Satna","Vidisha"],2],["Who discovered the Bharhut Stupa?",["John Marshall","Alexander Cunningham","D. R. Bhandarkar","A. G. Macdonell"],1],["In which year was the Bharhut Stupa discovered?",["1865","1873","1881","1890"],1],["The railing and gateway of the Bharhut Stupa were constructed during which period?",["Mauryan Period","Shunga Period","Kushan Period","Gupta Period"],1],["Where are the remains of the Bharhut Stupa currently preserved?",["Delhi Museum","Bhopal Museum","Calcutta Museum","London Museum"],2],["How many gateways does the Sanchi Stupa have?",["Two","Four","Six","None"],1],["Which part of the Sanchi Stupa is ornamental?",["Gateway","Railing","Pillar","Walls"],0],["Which Jataka is elaborately depicted on the northern gateway of the Sanchi Stupa?",["Mahakapi Jataka","Vessantara Jataka","Ghatanka Jataka","None of the above"],1],["The 'Shunga sculptures' of Bharhut are made of which type of stone?",["Limestone","Marble","Red sandstone","Granite"],2],["The carvings of the Sanchi Stupa particularly appear to be inspired by the carving of:",["Iron","Brass","Clay","Ivory"],3],["Like Sanchi, Bharhut also lacks the representation of which figure?",["Surya","Indra","Buddha","Tirthankara"],2],["Where is the ancient medallion with relief sculpture depicting 'Maya's Dream' found?",["Bharhut railing","Sanchi railing","Jetavana Park","Sarnath Pillar"],0],["The famous stone relief 'Yakshi Chandra' is from which site?",["Sanchi","Bharhut","Amaravati","Udayagiri"],1],["The Bharhut stupas belong to which period?",["Shunga Period","Gupta Period","Chalukya Period","Chandela Period"],0],["General Taylor, Major Cole, Sir John Marshall and Mohammad Hamid Qureshi, among others, contributed to the preservation of which stupa?",["Bharhut","Sanchi","Amaravati","Sarnath"],1],["In the Shunga-period sculpture of Chulkoka Yakshini found at Bharhut, she is shown standing on what?",["Elephant","Lion","Lotus","Tortoise"],0],["The Avanti Mahajanapada mainly extended over which region?",["Eastern India","Western and Central Malwa","Northern Punjab","Magadha region"],1],["How many major branches did the Avanti Mahajanapada have?",["One","Two","Three","Four"],1],["What was the capital of Northern Avanti?",["Mahishmati","Ujjayini","Champa","Vaishali"],1],["What was the capital of Southern Avanti?",["Ujjayini","Shravasti","Mahishmati","Taxila"],2],["Who was the famous king of Avanti during the time of Gautama Buddha?",["Bimbisara","Ajatashatru","Pradhot","Pradyota"],2],["Who sent Jivaka to King Pradhot of Avanti?",["Bimbisara","Ajatashatru","Prashat","Udayana"],0],["Avanti was a major centre of trade in which commodity?",["Salt","Cotton","Rice","Pearls"],1],["Who incorporated the Avanti Mahajanapada into Magadha?",["Bimbisara","Ajatashatru","Shishunaga","Prasenajit"],2],["Which river flowed between Northern Avanti and Southern Avanti?",["Narmada","Chambal","Betwa","Tapti"],2],["How many of the 16 Mahajanapadas were located in the Madhya Pradesh region?",["1","2","3","4"],1],["The Chedi Mahajanapada is associated with which modern region?",["Malwa","Bundelkhand","Baghelkhand","Nimar"],1],["What was the capital of the Chedi Mahajanapada?",["Ujjayini","Mahishmati","Shuktimati","Champa"],2],["Who was the prominent ruler of the Chedi Mahajanapada?",["Udayana","Shishunaga","Pradyota","Bimbisara"],1],["The famous love legend of Udayana and Vasavadatta is associated with which city?",["Vidisha","Shuktimati","Ujjain","Kaushambi"],2],["Where was the capital of Shunga ruler Agnimitra?",["Pataliputra","Vidisha","Ujjain","Kaushambi"],1],["From which text do we learn that Agnimitra, son of Pushyamitra Shunga, was the governor of Vidisha?",["Abhijnanashakuntalam","Malavikagnimitram","Meghaduta","Raghuvamsha"],1],["Which Shunga ruler repaired the gateway of the Bharhut Stupa and installed the railing of the Sanchi Stupa?",["Agnimitra","Vasujyeshtha","Pushyamitra Shunga","Bhagabhadra"],2],["Who was the author of the 'Malavikagnimitram', which provides information about the Shunga dynasty?",["Kalidasa","Bhasa","Ashvaghosha","Banabhatta"],0],["Who discovered the Heliodorus Pillar inscription at Vidisha?",["James Prinsep","Alexander Cunningham","John Marshall","J. F. Fleet"],1],["Where is the Heliodorus Pillar inscription currently located?",["Sanchi","Ujjain","Vidisha","Pataliputra"],2],["Who erected the Heliodorus Pillar?",["Antialcidas","Heliodorus","Bhagabhadra","Pushyamitra Shunga"],1],["The Heliodorus Pillar inscription is considered the earliest epigraphic evidence of which religion?",["Buddhism","Jainism","Bhagavata religion","Shaivism"],2],["Heliodorus was the ambassador of which Yavana ruler?",["Demetrius","Menander","Antialcidas","Alexander"],2],["Heliodorus came to the court of which Shunga ruler?",["Pushyamitra Shunga","Agnimitra","Bhagabhadra","Vasujyeshtha"],2],["By which title is Vasudeva addressed in the Heliodorus Pillar inscription at Vidisha?",["Devadhideva","Devadevas","Herakles","Vaishnava"],1],["During the reign of the ninth Shunga ruler Bhagabhadra, Greek ambassador Heliodorus erected the 'Garuda Dhvaja' at Vidisha. Which religion greatly influenced him?",["Buddhism","Jainism","Bhagavata religion","Shaivism"],2]];
let i=0,ans=Array(qs.length).fill(null),sec=3600,submitted=false,stopped=false,feedbackTimer=null;
function render(){document.getElementById("counter").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("pct").textContent=Math.round((i+1)/qs.length*100)+"%";document.getElementById("question").innerHTML=qs[i][0];document.getElementById("options").innerHTML=qs[i][1].map((x,j)=>{let cls="opt";if(ans[i]!==null){if(j===qs[i][2])cls+=" correct";if(j===ans[i]&&j!==qs[i][2])cls+=" wrong";if(j===ans[i])cls+=" selected"}else if(ans[i]===j)cls+=" selected";return '<button class="'+cls+'" onclick="pick('+j+')" '+(ans[i]!==null?"disabled":"")+'>'+String.fromCharCode(65+j)+". "+x+'</button>'}).join("");document.getElementById("palette").innerHTML=qs.map((_,j)=>'<button class="p '+(ans[j]!=null?'done ':'')+(j===i?'current':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join("")}
function pick(j){if(stopped||ans[i]!==null)return;ans[i]=j;render();showFeedback(j);if(i<qs.length-1){feedbackTimer=setTimeout(next,900)}else{feedbackTimer=setTimeout(()=>showFeedback(j,true),900)}}
function showFeedback(j,last=false){const f=document.getElementById("feedback");const correct=qs[i][2];f.classList.remove("hidden");f.innerHTML=j===correct?'<b style="color:#137333">✓ Correct Answer</b>':'<b style="color:#b3261e">✗ Incorrect</b><br>Correct answer: <b>'+String.fromCharCode(65+correct)+". "+qs[i][1][correct]+'</b>';if(last)f.innerHTML+='<br><br><button class="btn" onclick="submitTest()">Submit Test</button>'}function next(){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function go(j){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");i=j;render()}
function submitTest(){if(submitted||stopped)return;if(confirm("Submit Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);submitted=true;finish()}}function stopTest(){if(stopped||submitted)return;if(confirm("Stop Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);stopped=true;document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML="<h2>Test Stopped</h2><p>Test was stopped. Submit a test to save Wrong Questions.</p>";document.getElementById("quiz").classList.add("hidden")}}
function finish(){let c=0,w=0,b=0;ans.forEach((x,j)=>x==null?b++:x===qs[j][2]?c++:w++);let score=c*3-w;localStorage.setItem("mppsc_iq_wrong_test02",JSON.stringify(ans.map((x,j)=>x!=null&&x!==qs[j][2]?j:null).filter(x=>x!==null)));localStorage.setItem("mppsc_iq_skipped_test02",JSON.stringify(ans.map((x,j)=>x==null?j:null).filter(x=>x!==null)));document.getElementById("quiz").classList.add("hidden");document.getElementById("feedback").classList.add("hidden");const r=document.getElementById("result");r.classList.remove("hidden");r.innerHTML='<h2>Test Submitted</h2><div class="score">'+score+' Marks</div><div class="grid2"><div class="mini">Correct<br><b>'+c+'</b></div><div class="mini">Wrong<br><b>'+w+'</b></div><div class="mini">Skipped<br><b>'+b+'</b></div><div class="mini">Total Questions<br><b>'+qs.length+'</b></div></div>'}
function show(x){quiz.classList.remove("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.add("hidden")}function wrong(){quiz.classList.add("hidden");result.classList.add("hidden");notesView.classList.add("hidden");wrongView.classList.remove("hidden");let a=JSON.parse(localStorage.getItem("mppsc_iq_wrong_test02")||"[]").map(j=>({j,t:"Wrong"})),b=JSON.parse(localStorage.getItem("mppsc_iq_skipped_test02")||"[]").map(j=>({j,t:"Skipped"})),all=[...a,...b].sort((x,y)=>x.j-y.j);wrongView.innerHTML="<h2>Wrong / Skipped Questions</h2>"+(all.length?all.map(o=>'<div class="wrong"><b>Q'+(o.j+1)+' — '+o.t+'</b><br>'+qs[o.j][0]+'<br><small>Correct answer: <b>'+String.fromCharCode(65+qs[o.j][2])+'. '+qs[o.j][1][qs[o.j][2]]+'</b></small></div>').join(""):"<p>No wrong or skipped questions.</p>")}function notes(){quiz.classList.add("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.remove("hidden");notesView.innerHTML="<h2>Notes — One Liner Facts</h2>"+qs.map((q,j)=>'<div class="mini" style="text-align:left"><b>'+(j+1)+'.</b> '+q[0]+' → <b>'+q[1][q[2]]+'</b></div>').join("")}
setInterval(()=>{if(sec>0&&!submitted&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!submitted&&!stopped){submitted=true;finish()}},1000);
render();try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script></body></html>
