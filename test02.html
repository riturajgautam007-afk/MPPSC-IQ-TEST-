tion id="wrongView" class="card hidden"></section><section id="notesView" class="card hidden"></section></div><script>const qs=[{"h":"वैदिक साहित्य में सभा और समिति को किस देवता की दो पुत्रियाँ कहा गया है?","e":"According to Vedic literature, Sabha and Samiti were said to be the two daughters of which deity?","o":["अग्नि — Agni","प्रजापति — Prajapati","वरुण — Varuna","रुद्र — Rudra"],"a":1,"t":"MPPSC PYQ TEST 02","x":""},{"h":"बंगाल में तेभागा आन्दोलन कब प्रारम्भ हुआ था?","e":"When did the Tebhaga Movement begin in Bengal?","o":["सितम्बर 1946 — September 1946","अगस्त 1945 — August 1945","जनवरी 1938 — January 1938","मार्च 1935 — March 1935"],"a":0,"t":"MPPSC PYQ TEST 02","x":""},{"h":"चारों आश्रमों का उल्लेख सर्वप्रथम किस ग्रन्थ में किया गया है?","e":"In which text were the four Ashramas first mentioned?","o":["आरुणेय उपनिषद — Aruneya Upanishad","जाबालोपनिषद — Jabala Upanishad","परमहंस उपनिषद — Paramahamsa Upanishad","संन्यास उपनिषद — Sannyasa Upanishad"],"a":1,"t":"MPPSC PYQ TEST 02","x":""},{"h":"1918 ई. में संयुक्त प्रांत किसान सभा की स्थापना निम्न में से किसके द्वारा भी की गई थी?","e":"Who among the following was also involved in the establishment of the United Provinces Kisan Sabha in 1918?","o":["महामना मालवीय — Mahamana Malaviya","बाबा राम चन्द्र — Baba Ram Chandra","इन्द्र नारायण द्विवेदी — Indra Narayan Dwivedi","झिंगुरी सिंह — Jhinguri Singh"],"a":2,"t":"MPPSC PYQ TEST 02","x":""},{"h":"कृष्ण और बलराम का अंकन किस हिन्द-यवन शासक की मुद्राओं पर मिलता है?","e":"The depiction of Krishna and Balarama is found on the coins of which Indo-Greek ruler?","o":["मेनाण्डर — Menander","डेमेट्रियस — Demetrius","अगाथोक्लिज — Agathocles","यूक्रेटाइड्स — Eucratides"],"a":2,"t":"MPPSC PYQ TEST 02","x":""},{"h":"निम्नलिखित में से कौन, एक स्त्री आलवार संत थीं?","e":"Who among the following was a female Alvar saint?","o":["मधुर कवि — Madhurakavi","पेरुमल — Perumal","तिरुप्पान — Tiruppan","आण्डाल — Andal"],"a":3,"t":"MPPSC PYQ TEST 02","x":""},{"h":"प्राचीन संस्कृत साहित्य के अनुसार निम्नलिखित मसालों में से किसे यवनप्रिय कहा जाता था?","e":"According to ancient Sanskrit literature, which of the following spices was known as Yavanapriya?","o":["अदरक — Ginger","जायफल — Nutmeg","काली मिर्च — Black Pepper","इलायची — Cardamom"],"a":2,"t":"MPPSC PYQ TEST 02","x":""},{"h":"भारतवर्ष का उल्लेख किस अभिलेख में प्राप्त होता है?","e":"The term Bharatavarsha is mentioned in which inscription?","o":["धनदेव का ‘अयोध्या अभिलेख’ — Dhanadeva's 'Ayodhya Inscription'","मेहरौली का ‘लौह स्तम्भ लेख’ — Mehrauli Iron Pillar Inscription","बेसनगर का ‘गरुड़ध्वज अभिलेख’ — Besnagar 'Garudadhvaja Inscription'","खारवेल के ‘हाथीगुम्फा अभिलेख’ — Kharavela's 'Hathigumpha Inscription'"],"a":3,"t":"MPPSC PYQ TEST 02","x":""},{"h":"‘द सीक्रेट डॉक्ट्रिन’ का/की लेखक कौन था/थीं?","e":"Who was the author of 'The Secret Doctrine'?","o":["राजा राम मोहन राय — Raja Ram Mohan Roy","एच पी ब्लावात्स्की — H. P. Blavatsky","केशव चन्द्र सेन — Keshab Chandra Sen","डी के कर्वे — D. K. Karve"],"a":1,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मौर्य सम्राट अशोक का व्यक्तिगत नाम मध्य प्रदेश से प्राप्त किस लघु शिलालेख में मिलता है?","e":"In which Minor Rock Edict found in Madhya Pradesh is the personal name of Mauryan Emperor Ashoka mentioned?","o":["रूपनाथ — Rupnath","गुर्जरा — Gujjara","सारो मारो — Saro Maro","पानगुड़ारिया — Pangudariya"],"a":1,"t":"MPPSC PYQ TEST 02","x":""},{"h":"निम्नांकित बोलियों को उनसे सम्बन्धित जनजातीय प्रदेशों से सुमेलित कीजिए :\n\n(बोलियाँ) (जिला)\n\n(A) निमाड़ी (i) मण्डला, डिंडोरी\n\n(B) कोरकू (ii) रतलाम, अलीराजपुर\n\n(C) भीली (iii) बड़वानी, खण्डवा\n\n(D) गोंडी (iv) बैतूल, नर्मदापुरम\n\nसही उत्तर का चयन कीजिए:","e":"Match the following dialects with their respective tribal regions:","o":["(A) A-3, B-4, C-2, D-1","(B) A-4, B-3, C-1, D-2","(C) A-1, B-2, C-3, D-4","(D) A-2, B-1, C-4, D-3"],"a":0,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मध्य प्रदेश में निम्नांकित में से कौन-सा स्थल ‘विश्व धरोहर स्थल’ के रूप में मान्यता प्राप्त है?","e":"Which of the following sites in Madhya Pradesh has been recognized as a 'World Heritage Site'?","o":["ओरछा का ऐतिहासिक समूह — Historic Group of Orchha","साँची स्तूप — Sanchi Stupa","सतपुड़ा टाइगर रिजर्व — Satpura Tiger Reserve","भोजेश्वर मंदिर समूह — Bhojeshwar Temple Group"],"a":1,"t":"MPPSC PYQ TEST 02","x":""},{"h":"खजुराहो स्थित ‘जगदम्बी मंदिर’ की प्रमुख विशेषताओं में निम्नांकित में से कौन-सा असत्य है?","e":"Which of the following statements is incorrect regarding the major features of the 'Jagadambi Temple' at Khajuraho?","o":["इस मंदिर में एक ही कक्ष में अर्द्ध-मण्डप और बरामदा दोनों व्यवस्थित हैं। — Both the Ardha-Mandapa and veranda are arranged in the same chamber of this temple.","इस मंदिर में प्रदक्षिणा पथ का अभाव है। — This temple lacks a circumambulatory passage.","गर्भगृह में लक्ष्मी की एक विशालकाय मूर्ति है। — There is a colossal image of Lakshmi in the sanctum.","गर्भगृह के मुख्य द्वार पर विष्णु की मूर्ति अधिष्ठित है। — An image of Vishnu is installed at the main entrance of the sanctum."],"a":2,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मध्य प्रदेश में नर्मदापुरम जिले के आदमगढ़ पुरास्थल के विषय में निम्नांकित में से कौन-सा तथ्य असत्य है?","e":"Which of the following facts regarding the Adamgarh archaeological site in Narmadapuram district of Madhya Pradesh is incorrect?","o":["यह पुरास्थल नर्मदा नदी के तट पर स्थित है। — This archaeological site is situated on the bank of the Narmada River.","यहाँ पशुपालन के प्राचीनतम प्रमाण प्राप्त हुए हैं। — The earliest evidence of animal domestication has been found here.","इस पुरास्थल पर वी. एस. वाकणकर द्वारा पुरातात्त्विक उत्खनन किया गया था। — Archaeological excavations at this site were carried out by V. S. Wakankar.","यहाँ बड़ी संख्या में पुरापाषाणयुगीन उपकरण एवं अस्थि अवशेष प्राप्त हुए हैं। — A large number of Palaeolithic tools and bone remains have been found here."],"a":2,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मध्य प्रदेश के निम्नांकित साहित्यकारों को उनकी कृतियों से सुमेलित कीजिए :\n\nसाहित्यकार कृतियाँ\n\n(A) केशवदास (i) गंगालहरी\n\n(B) भवानी प्रसाद मिश्र ng the sessions of the Madhya Pradesh Legislative Assembly is incorrect?","o":["एक वर्ष में विधानसभा के न्यूनतम दो अधिवेशन होने चाहिए। — There must be at least two sessions of the Legislative Assembly in a year.","दो बैठकों के मध्य छः मास से अधिक का अन्तर नहीं होना चाहिए। — The interval between two sittings should not exceed six months.","राज्यपाल विधानसभा के अधिवेशन को बुलाते हैं। — The Governor summons the session of the Legislative Assembly.","विधानसभा अध्यक्ष विधानसभा के अधिवेशन को समाप्त करते हैं। — The Speaker terminates the session of the Legislative Assembly."],"a":3,"t":"MPPSC PYQ TEST 02","x":""},{"h":"निम्नलिखित में से किस आयोग को एंग्लो-इंडियन समुदाय के अधिकारों और हितों की रक्षा का विशेष दायित्व दिया गया है?","e":"Which of the following commissions has been given the special responsibility of protecting the rights and interests of the Anglo-Indian community?","o":["राष्ट्रीय अनुसूचित जाति आयोग — National Commission for Scheduled Castes","राष्ट्रीय अनुसूचित जनजाति आयोग — National Commission for Scheduled Tribes","राष्ट्रीय पिछड़ा वर्ग आयोग — National Commission for Backward Classes","राष्ट्रीय मानवाधिकार आयोग — National Human Rights Commission"],"a":0,"t":"MPPSC PYQ TEST 02","x":""},{"h":"राष्ट्रीय वायरल हेपेटाइटिस नियंत्रण कार्यक्रम का उद्देश्य किस वर्ष तक वायरल हेपेटाइटिस-सी को समाप्त करना है?","e":"By which year does the National Viral Hepatitis Control Programme aim to eliminate viral hepatitis-C?","o":["2033","2032","2031","2030"],"a":3,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मध्य प्रदेश आर्थिक सर्वेक्षण 2024-25 के अनुसार, मध्य प्रदेश में सौर ऊर्जा की क्षमता अक्टूबर, 2024 तक थी?","e":"According to the Madhya Pradesh Economic Survey 2024–25, what was the solar energy potential of Madhya Pradesh up to October 2024?","o":["60166 मेगावाट — 60,166 MW","66610 मेगावाट — 66,610 MW","66160 मेगावाट — 66,160 MW","61660 मेगावाट — 61,660 MW"],"a":3,"t":"MPPSC PYQ TEST 02","x":""},{"h":"मध्य प्रदेश के आर्थिक सर्वेक्षण 2024-25 के अनुसार, ‘एक जिला एक उत्पाद (ODOP)’ म  flag bearers for India at the opening ceremony of the Commonwealth Games 2026?","o":["मीराबाई चानू और लवलीना बोरगोहेन — Mirabai Chanu and Lovlina Borgohain","नीरज चोपड़ा और पी.वी. सिंधु — Neeraj Chopra and P. V. Sindhu","बजरंग पूनिया और मैरी कॉम — Bajrang Punia and Mary Kom","मनु भाकर और निखत ज़रीन — Manu Bhaker and Nikhat Zareen"],"a":0,"t":"MPPSC PYQ TEST 02","x":""}];let i=0,ans=Array(qs.length).fill(null),submitted=false,remaining=3600,last=Date.now(),timerId;const $=x=>document.getElementById(x);function render(){let d=qs[i],multi=Array.isArray(d.a);$('counter').textContent='Question '+(i+1)+' / '+qs.length;$('pct').textContent=Math.round((i+1)/qs.length*100)+'%';$('question').innerHTML='<span class="qhi">'+esc(d.h)+'</span><span class="qen">'+esc(d.e)+'</span>';$('options').innerHTML=d.o.map((o,j)=>{let sel=Array.isArray(ans[i])?ans[i].includes(j):ans[i]===j;let correct=multi?d.a.includes(j):d.a===j;let cls='opt'+(sel?' selected':'');if(submitted&&correct)cls+=' correct';if(submitted&&sel&&!correct)cls+=' wrong';return '<button class="'+cls+'" onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>'}).join('');palette();}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function pick(j){if(submitted)return;let d=qs[i];if(Array.isArray(d.a)){ans[i]=ans[i]||[];if(ans[i].includes(j))ans[i]=ans[i].filter(x=>x!==j);else ans[i].push(j)}else ans[i]=j;render();if(!Array.isArray(d.a)){setTimeout(()=>next(),500)}}function next(){if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function palette(){ $('palette').innerHTML=qs.map((_,j)=>'<button class="p '+(j===i?'current ':'')+(ans[j]!==null?'done':'')+'" onclick="i='+j+';render()">'+(j+1)+'</button>').join('')}function tick(){remaining--;if(remaining<=0){remaining=0;submitTest();return}let m=Math.floor(remaining/60),s=remaining%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function submitTest(){if(submitted)return;if(!confirm('Test submit करें?'))return;submitted=true;clearInterval(timerId);let c=0,w=0,s=0;qs.forEach((d,k)=>{if(ans[k]===null||Array.isArray(ans[k])&&!ans[k].length){s++;return}let ok=Array.isArray(d.a)?Array.isArray(ans[k])&&ans[k].length===d.a.length&&ans[k].every(x=>d.a.includes(x)):ans[k]===d.a;if(ok)c++;else w++});let score=c*3-w;result(c,w,s,score);render()}function result(c,w,s,score){show('result');$('result').innerHTML='<h2>Result / परिणाम</h2><div class="score">'+score+' / '+(qs.length*3)+'</div><div class="mini">सही / Correct: <b>'+c+'</b></div><div class="mini">गलत / Wrong: <b>'+w+'</b></div><div class="mini">छोड़े / Skipped: <b>'+s+'</b></div><div class="mini">Accuracy: <b>'+((c/(c+w||1))*100).toFixed(1)+'%</b></div><button class="btn" onclick="show(\'quiz\')">Back to Test</button>'}function wrong(){show('wrongView');let h='<h2>Wrong / Skipped</h2>';qs.forEach((d,k)=>{let skip=ans[k]===null||Array.isArray(ans[k])&&!ans[k].length;if(skip||(!skip&&(Array.isArray(d.a)?!(Array.isArray(ans[k])&&ans[k].length===d.a.length&&ans[k].every(x=>d.a.includes(x))):ans[k]!==d.a))){h+='<div class="wrongcard"><b>Q'+(k+1)+'. '+esc(d.h)+'</b><br><span>'+esc(d.e)+'</span><br><b>सही उत्तर: '+(Array.isArray(d.a)?d.a.map(x=>String.fromCharCode(65+x)+'. '+esc(d.o[x])).join(' / '):String.fromCharCode(65+d.a)+'. '+esc(d.o[d.a]))+'</b></div>'}});$('wrongView').innerHTML=h}function notes(){show('notesView');$('notesView').innerHTML='<h2>Notes / Revision</h2>'+qs.map((d,k)=>'<div class="note"><div class="nq">Q'+(k+1)+'. '+esc(d.h)+'</div><div class="ne">'+esc(d.e)+'</div><div class="answer">उत्तर / Answer: '+(Array.isArray(d.a)?d.a.map(x=>String.fromCharCode(65+x)+'. '+esc(d.o[x])).join(' / '):String.fromCharCode(65+d.a)+'. '+esc(d.o[d.a]))+'</div></div>').join('')}function show(id){['quiz','result','wrongView','notesView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(id==='quiz')document.querySelectorAll('.tab')[0].classList.add('active');if(id==='wrongView')document.querySelectorAll('.tab')[1].classList.add('active');if(id==='notesView')document.querySelectorAll('.tab')[2].classList.add('active')}function stopTest(){if(confirm('Test रोककर submit करें?'))submitTest()}timerId=setInterval(tick,1000);render();</script></body></html>
