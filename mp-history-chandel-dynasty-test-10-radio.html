let answered={},englishMode=false;
function render(){document.getElementById('notes').innerHTML=DATA.map(x=>'<article class="card" data-q="'+x.n+'"><div class="q"><span class="num">'+x.n+'</span>'+x.q+'</div>'+x.o.map((o,j)=>'<label class="opt" data-choice="'+j+'"><input type="radio" name="q'+x.n+'" value="'+j+'"><b>'+String.fromCharCode(65+j)+'.</b><span>'+o+'</span></label>').join('')+'<div class="result" hidden></div></article>').join('');document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>choose(el))); }
function choose(el){let card=el.closest('.card'),n=+card.dataset.q;if(answered[n]!==undefined)return;let choice=+el.dataset.choice,item=DATA[n-1];answered[n]=choice;card.querySelectorAll('.opt').forEach((op,j)=>{op.classList.add('locked');if(j===item.a)op.classList.add('correct');if(j===choice&&choice!==item.a)op.classList.add('wrong')});let r=card.querySelector('.result');r.hidden=false;r.className='result '+(choice===item.a?'right':'wrong');r.textContent=choice===item.a?'✓ सही उत्तर!':'✗ गलत उत्तर। सही उत्तर: '+String.fromCharCode(65+item.a)+'. '+item.o[item.a];}
document.getElementById('scoreBtn').onclick=()=>{let total=DATA.length,done=Object.keys(answered).length,correct=DATA.filter(x=>answered[x.n]===x.a).length,wrong=done-correct,score=correct*3-wrong;let s=document.getElementById('score');s.style.display='block';s.innerHTML='आपका परिणाम / Your Result<br>कुल प्रश्न: '+total+' | हल किए: '+done+'<br>सही: '+correct+' | गलत: '+wrong+' | छोड़े: '+(total-done)+'<br><strong>स्कोर: '+score+' / '+(total*3)+'</strong>';s.scrollIntoView({behavior:'smooth',block:'center'});};
document.getElementById('refreshBtn').onclick=()=>{answered={};document.getElementById('score').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('hiBtn').onclick=()=>{englishMode=false;document.getElementById('hiBtn').classList.add('active');document.getElementById('enBtn').classList.remove('active');};
document.getElementById('enBtn').onclick=()=>{englishMode=true;document.getElementById('enBtn').classList.add('active');document.getElementById('hiBtn').classList.remove('active');alert('This question bank is provided in Hindi. English controls are included; English translations can be added in a subsequent update.');};
render();
</script></body></html>
