function show(){quiz.classList.remove("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.add("hidden");document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===0))}
function wrong(){quiz.classList.add("hidden");result.classList.add("hidden");notesView.classList.add("hidden");wrongView.classList.remove("hidden");document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===1));let a=JSON.parse(localStorage.getItem("mppsc_iq_wrong_test03")||"[]").map(j=>({j,t:"Wrong"})),b=JSON.parse(localStorage.getItem("mppsc_iq_skipped_test03")||"[]").map(j=>({j,t:"Skipped"})),all=[...a,...b].sort((x,y)=>x.j-y.j);wrongView.innerHTML="<h2>Wrong / Skipped Questions</h2>"+(all.length?all.map(o=>'<div class="wrong"><b>Q'+(o.j+1)+" — "+o.t+"</b><br>"+qs[o.j][0]+"<br><small>Correct answer: <b>"+String.fromCharCode(65+qs[o.j][2])+". "+qs[o.j][1][qs[o.j][2]]+"</b></small></div>").join(""):"<p>No wrong or skipped questions.</p>")}
function notes(){quiz.classList.add("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");notesView.classList.remove("hidden");document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===2));notesView.innerHTML="<h2>Notes — One Liner Facts</h2>"+qs.map((q,j)=>'<div class="mini" style="text-align:left"><b>'+(j+1)+".</b> "+q[0]+" → <b>"+q[1][q[2]]+"</b></div>").join("")}
setInterval(()=>{if(sec>0&&!submitted&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!submitted&&!stopped){submitted=true;finish()}},1000);
render();try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script></body></html>
