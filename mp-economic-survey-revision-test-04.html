nt schemes is for Scheduled Tribe youth?",["भगवान बिरसा मुंडा स्वरोजगार योजना","संत रविदास स्वरोजगार योजना","डॉ. भीमराव अम्बेडकर आर्थिक कल्याण योजना","मुख्यमंत्री उद्यम क्रांति योजना"],["Bhagwan Birsa Munda Self-Employment Scheme","Sant Ravidas Self-Employment Scheme","Dr. Bhimrao Ambedkar Economic Welfare Scheme","Mukhyamantri Udyam Kranti Yojana"],0],["मप्र आर्थिक सर्वेक्षण 2025-26 के अनुसार वित्तीय वर्ष 2000-01 की तुलना में वर्ष 2025-26 में मध्यप्रदेश के बजट में लगभग कितनी गुना वृद्धि हुई है?","According to the MP Economic Survey 2025-26, approximately how many times larger is Madhya Pradesh’s budget in 2025-26 than in FY 2000-01?",["13 गुना","18 गुना","23 गुना","28 गुना"],["13 times","18 times","23 times","28 times"],2],["मप्र आर्थिक सर्वेक्षण 2025-26 के अनुसार वर्ष 2025-26 में GSDP के प्रतिशत के रूप में SGST कितना है?","According to the MP Economic Survey 2025-26, what is SGST as a percentage of GSDP in 2025-26?",["1.49 प्रतिशत","2.49 प्रतिशत","2.59 प्रतिशत","2.77 प्रतिशत"],["1.49%","2.49%","2.59%","2.77%"],1],["मप्र आर्थिक सर्वेक्षण 2025-26 के अनुसार वर्ष 2025-26 में निम्नलिखित में से किस कर मद का GSDP में प्रतिशत सर्वाधिक है?","According to the MP Economic Survey 2025-26, which tax item has the highest percentage of GSDP in 2025-26?",["राज्य आबकारी शुल्क","वाणिज्यिक कर","SGST","स्टाम्प और पंजीकरण"],["State excise duty","Commercial tax","SGST","Stamp duty and registration"],2],["प्रधानमंत्री जन-धन योजना (PMJDY) का शुभारंभ किस वर्ष किया गया था?","In which year was the Pradhan Mantri Jan-Dhan Yojana (PMJDY) launched?",["2012","2014","2016","2018"],["2012","2014","2016","2018"],1],["मध्यप्रदेश राजकोषीय उत्तरदायित्व एवं बजट प्रबंधन अधिनियम किस वर्ष लागू किया गया?","In which year was the Madhya Pradesh Fiscal Responsibility and Budget Management Act implemented?",["2003","2004","2005","2006"],["2003","2004","2005","2006"],2],["प्रधानमंत्री जन-धन योजना (PMJDY) की आधिकारिक शुरुआत भारत में किस तिथि को की गई थी?","On which date was the Pradhan Mantri Jan-Dhan Yojana (PMJDY) officially launched in India?",["15 अगस्त 2014","28 अगस्त 2014","2 अक्टूबर 2014","26 जनवरी 2015"],["15 August 2014","28 August 2014","2 October 2014","26 January 2015"],1]];const letters=['A','B','C','D'];const notes=document.getElementById('notes');
questions.forEach((q,i)=>{const card=document.createElement('article');card.className='card';card.dataset.q=i+1;const title=document.createElement('div');title.className='q';title.innerHTML='<span class="num">'+(i+1)+'</span><span class="hi"></span><span class="en q-en"></span>';title.querySelector('.hi').textContent=q[0];title.querySelector('.en').textContent=q[1];card.appendChild(title);q[2].forEach((opt,j)=>{const label=document.createElement('label');label.className='opt';const radio=document.createElement('input');radio.type='radio';radio.name='q'+(i+1);radio.value=letters[j];const b=document.createElement('b');b.textContent=letters[j]+'.';const hi=document.createElement('span');hi.className='hi';hi.textContent=opt;const en=document.createElement('span');en.className='en';en.textContent=q[3][j];label.append(radio,b,hi,en);radio.addEventListener('change',()=>chooseOption(radio));label.addEventListener('click',()=>{if(!radio.disabled)radio.checked=true;});card.appendChild(label)});const ans=document.createElement('div');ans.className='answer-key';ans.hidden=true;ans.dataset.correct=letters[q[4]];card.appendChild(ans);notes.appendChild(card)});if(notes.firstElementChild)notes.firstElementChild.classList.add('active');
function chooseOption(input){const card=input.closest('.card');if(!card||card.classList.contains('answered'))return;const correct=card.querySelector('.answer-key').dataset.correct;card.classList.add('answered');card.querySelectorAll('.opt').forEach(label=>{const r=label.querySelector('input');r.disabled=true;label.classList.add('locked');if(r.value===correct)label.classList.add('correct');if(r===input&&r.value!==correct)label.classList.add('wrong')});const result=document.createElement('div');result.className='result '+(input.value===correct?'right':'wrong');result.textContent=input.value===correct?(document.documentElement.lang==='en'?'✓ Correct answer':'✓ सही उत्तर'):(document.documentElement.lang==='en'?'✗ Incorrect — correct option: ':'✗ गलत उत्तर — सही विकल्प: ')+correct;card.appendChild(result);const next=card.nextElementSibling;if(next)setTimeout(()=>{card.classList.remove('active');next.classList.add('active');window.scrollTo({top:document.querySelector('.head').offsetTop,behavior:'auto'})},700)}
function setLang(en){document.documentElement.lang=en?'en':'hi';document.body.classList.toggle('english',en);document.getElementById('hiBtn').classList.toggle('active',!en);document.getElementById('enBtn').classList.toggle('active',en);document.getElementById('scoreBtn').textContent=en?'Total Score':'कुल स्कोर';document.getElementById('refreshBtn').textContent=en?'Refresh / Try Again':'रिफ्रेश / पुनः प्रयास'}
document.getElementById('hiBtn').onclick=()=>setLang(false);document.getElementById('enBtn').onclick=()=>setLang(true);
document.getElementById('scoreBtn').onclick=()=>{let correct=0,wrong=0,attempted=0;notes.querySelectorAll('.card').forEach(c=>{if(c.classList.contains('answered')){attempted++;if(c.querySelector('.result.right'))correct++;else wrong++}});const score=correct*3-wrong;const box=document.getElementById('scoreBox');box.textContent=document.documentElement.lang==='en'?'Score: '+score+' / 150 | Correct: '+correct+' | Incorrect: '+wrong+' | Unattempted: '+(50-attempted)+' | Attempted: '+attempted:'स्कोर: '+score+' / 150 | सही: '+correct+' | गलत: '+wrong+' | अनुत्तरित: '+(50-attempted)+' | प्रयास: '+attempted;box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'center'})};
function resetTest(){window.location.href=window.location.pathname+'?reset='+Date.now()}
document.getElementById('refreshBtn').onclick=resetTest;
</script></body></html>
