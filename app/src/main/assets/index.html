<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><title>MPPSC IQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh}.top{background:#0f172a;color:#fff;padding:22px 18px;border-radius:0 0 24px 24px}.brand{font-size:23px;font-weight:900}.screen{padding:16px 16px 90px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #17203310}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:16px;padding:14px}.num{font-size:23px;font-weight:800}.muted{color:#64748b;font-size:13px}.btn,.full{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.full{width:100%;margin-top:8px}.field{width:100%;padding:13px;border:1px solid #dbe1ea;border-radius:12px;margin:6px 0}.option{width:100%;text-align:left;padding:14px;background:#fff;border:1px solid #dbe1ea;border-radius:13px;margin:6px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;z-index:5}.nav button{background:none;border:0;color:#64748b;font-size:11px}.login{min-height:100vh;background:linear-gradient(145deg,#0f172a,#1d4ed8);display:flex;align-items:center;padding:20px}.loginbox{background:#fff;border-radius:24px;padding:24px;width:100%}
</style></head><body><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,increment} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const config={apiKey:"AIzaSyB20mkcyG92bQjlXoDu1oUf_oouk-jEemA",authDomain:"mppsc-iq.firebaseapp.com",projectId:"mppsc-iq",storageBucket:"mppsc-iq.firebasestorage.app",messagingSenderId:"933540789062",appId:"1:933540789062:android:48fdc441523386749f8347"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
let user=null,mode="login",page="home",qi=0,score=0,answers=[],profile={done:0,score:0,target:100};
const qs=[
["चंदेल वंश का उत्कर्ष किस क्षेत्र में हुआ था?",["मालवा","बुंदेलखंड","विदर्भ","कन्नौज"],1],
["बुंदेलखंड का प्राचीन नाम क्या था?",["दशार्ण","अवंती","जेजकभुक्ति","विदिशा"],2],
["औलिकर वंश के संस्थापक कौन माने जाते हैं?",["जयवर्मा","यशोधर्मन","वत्सभट्टी","हर्षवर्धन"],0],
["दशपुर अभिलेख के लेखक कौन थे?",["कालिदास","वत्सभट्टी","बाणभट्ट","भवभूति"],1],
["चंदेलों की प्रसिद्ध राजधानी कौन-सी थी?",["खजुराहो","उज्जैन","मांडू","महेश्वर"],0]
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function loadProfile(){const r=doc(db,"users",user.uid),s=await getDoc(r);if(s.exists())profile={...profile,...s.data()};else await setDoc(r,{name:user.displayName||"Student",email:user.email,target:100,done:0,score:0,createdAt:Date.now()});}
function authView(){return '<div class="login"><div class="loginbox"><h1>🇮🇳 MPPSC IQ</h1><p class="muted">आपकी तैयारी • आपका लक्ष्य • आपकी Progress</p>'+(mode==="login"?'<input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button class="full" onclick="login()">Login</button><button class="full" style="background:#eef2ff;color:#1d4ed8" onclick="toggle()">नया account बनाएँ</button>':'<input id="name" class="field" placeholder="आपका नाम"><input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password (6+ characters)"><button class="full" onclick="signup()">Create Account</button><button class="full" style="background:#eef2ff;color:#1d4ed8" onclick="toggle()">Login</button>')+'</div></div>'}
window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value)}catch(e){alert(e.message)}};
window.signup=async()=>{try{const c=await createUserWithEmailAndPassword(auth,email.value,pass.value);if(name.value)await updateProfile(c.user,{displayName:name.value});}catch(e){alert(e.message)}};
window.toggle=()=>{mode=mode==="login"?"signup":"login";render()};
function nav(){return '<div class="nav"><button onclick="go(\'home\')">🏠<br>Home</button><button onclick="go(\'study\')">📚<br>Study</button><button onclick="start()">📝<br>Test</button><button onclick="go(\'profile\')">👤<br>Profile</button></div>'}
function home(){const p=Math.min(100,Math.round(profile.done/profile.target*100));return '<div class="screen"><h2>नमस्ते, '+esc(user.displayName||"Aspirant")+' 👋</h2><div class="card hero"><h2>आज का लक्ष्य 🎯</h2><b>'+profile.done+' / '+profile.target+' MCQs</b><div style="height:9px;background:#ffffff44;border-radius:9px;margin:14px 0"><div style="height:100%;width:'+p+'%;background:#fff;border-radius:9px"></div></div>'+p+'%</div><div class="grid"><div class="stat"><div class="num">'+profile.done+'</div><div class="muted">Attempted</div></div><div class="stat"><div class="num">'+profile.score+'</div><div class="muted">Correct</div></div></div><div class="card"><h3>📝 MCQ Practice Test</h3><p class="muted">5 प्रश्न • Quick Test</p><button class="btn" onclick="start()">Start Test</button></div><div class="card"><h3>📚 Study Material</h3><p class="muted">MP History • Geography • Polity • Economy • Environment</p></div></div>'}
function study(){return '<div class="screen"><h2>📚 Study Material</h2>'+["ज्ञान परंपरा","MP HISTORY","MP GEOGRAPHY","MP POLITY","MP ENVIRONMENT","MP ECONOMY"].map((x,i)=>'<div class="card"><b>UNIT '+(i+1)+' | '+x+'</b><p class="muted">Topic-wise MCQs और Notes</p></div>').join("")+'</div>'}
function profileView(){return '<div class="screen"><h2>👤 Profile</h2><div class="card"><b>'+esc(user.displayName||"Student")+'</b><p class="muted">'+esc(user.email)+'</p><p>MCQs: '+profile.done+' • Correct: '+profile.score+'</p><button class="btn" onclick="logout()">Logout</button></div></div>'}
window.logout=()=>signOut(auth);window.go=p=>{page=p;render()};window.start=()=>{page="test";qi=0;score=0;answers=[];render()};
function test(){const q=qs[qi];return '<div class="screen"><div class="card"><div class="muted">Question '+(qi+1)+' / '+qs.length+'</div><h3>'+esc(q[0])+'</h3>'+q[1].map((o,i)=>'<button class="option" onclick="answer('+i+')">'+String.fromCharCode(65+i)+') '+esc(o)+'</button>').join("")+'</div></div>'}
window.answer=async i=>{answers[qi]=i;if(i===qs[qi][2])score++;if(qi<qs.length-1){qi++;render();}else{profile.done+=qs.length;profile.score+=score;try{await updateDoc(doc(db,"users",user.uid),{done:increment(qs.length),score:increment(score)});}catch(e){}page="result";render()}};
function result(){return '<div class="screen"><div class="card hero"><h2>📊 Result</h2><h1>'+score+' / '+qs.length+'</h1><p>Accuracy '+Math.round(score/qs.length*100)+'%</p></div>'+qs.map((q,i)=>'<div class="card"><b>'+(i+1)+'. '+esc(q[0])+'</b><p class="muted">'+(answers[i]===q[2]?'✅ सही':'❌ गलत')+' • सही उत्तर: '+esc(q[1][q[2]])+'</p></div>').join("")+'<button class="btn" onclick="go(\'home\')">Back to Home</button></div>'}
async function render(){if(!user){document.getElementById("app").innerHTML=authView();return}if(page==="home"||page==="study"||page==="profile")await loadProfile();let body=page==="home"?home():page==="study"?study():page==="test"?test():result();document.getElementById("app").innerHTML='<div class="app"><div class="top"><div class="brand">🇮🇳 MPPSC IQ</div><div style="opacity:.7;font-size:12px">MPPSC Preparation App</div></div>'+body+nav()+'</div>'}
onAuthStateChanged(auth,async u=>{user=u;if(user)await loadProfile();render()});
</script></body></html>
