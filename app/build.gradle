plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'com.mppsciq.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mppsciq.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def ksFile = System.getenv('MPPSC_KEYSTORE_FILE')
            def ksPassword = System.getenv('MPPSC_KEYSTORE_PASSWORD')
            def ksAlias = System.getenv('MPPSC_KEY_ALIAS')
            def keyPassword = System.getenv('MPPSC_KEY_PASSWORD')
            if (ksFile && ksPassword && ksAlias && keyPassword) {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        debug { versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

// Play Store release signing is supplied only through GitHub Actions secrets.
