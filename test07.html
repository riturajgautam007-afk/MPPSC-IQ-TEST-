l political and cultural capital of the Paramara Empire during Bhoja's reign?",["Ujjain","Vidisha","Mandu","Dhar"],3],["Which Chalukya ruler of South Gujarat did Raja Bhoja defeat and compel to accept his suzerainty?",["Barapa","Kirtiraja","Chamundaraja","Durlabharaja"],1],["Which Shilahara ruler of Aparanta (Northern Konkan) was compelled by Bhoja to accept his suzerainty?",["Arikesari","Chhittaraja","Aparajita","Keshideva"],0],["Which Somavamsi ruler of Odisha was defeated by Raja Bhoja, as mentioned in the Udaipur Prashasti?",["Yayati II","Indraratha","Dharmaratha","Janamejaya"],1],["Which Tripuri Kalachuri ruler was defeated by Raja Bhoja in the initial wars?",["Kokalla II","Gangeyadeva","Lakshmikarna","Yuvraja Deva"],1],["Which Chauhan ruler of the Shakambhari region was defeated and killed by Raja Bhoja?",["Durlabharaja III","Viryarama","Vakpatiraja II","Vigraharaja"],1],["With which Chalukya ruler of Kalyani did Raja Bhoja have a prolonged and fierce conflict?",["Satyashraya","Jayasimha II","Someshvara I","Vikramaditya VI"],1],["Which two powerful neighbouring dynasties formed an alliance in the final years of Raja Bhoja to check his growing influence?",["Chola and Pala dynasties","Solanki and Kalachuri dynasties","Chauhan and Chandel dynasties","Rashtrakuta and Yadava dynasties"],1],["Which famous saying expresses the condition of Dhar after the death of Raja Bhoja?",["Sarve Bhavantu Sukhinah","Adya Dhara Niradhara Niralamba Sarasvati","Satyameva Jayate Nanritam","Vidvan Sarvatra Pujyate"],1],["Which distinctive title was bestowed upon Raja Bhoja because of his extraordinary versatility, writing and patronage of poets?",["Sakalottarapathanatha","Kaviraja","Trailokyamalla","Amoghavarsha"],1],["Traditionally, how many works is Raja Bhoja believed to have composed?",["24 works","50 works","84 works","108 works"],2],["What is the name of Raja Bhoja's famous work dealing with architecture, town planning, palace construction and mechanical devices?",["Kavyaprakash const qs=raw.map(x=>[x[0],x[1],x[2]]);let i=0,ans=Array(qs.length).fill(null),submitted=false,seconds=3600;const key="mppsc_iq_wrong_test07";
function save(){localStorage.setItem(key,JSON.stringify(ans))}
function render(){let q=qs[i];document.getElementById("counter").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("pct").textContent=Math.round((i+1)/qs.length*100)+"%";document.getElementById("question").innerHTML="<div>"+q[0]+"</div>";document.getElementById("options").innerHTML=q[1].map((o,k)=>"<button class='opt "+(ans[i]===k?"selected":"")+"' onclick='pick("+k+")'>"+String.fromCharCode(65+k)+") "+o+"</button>").join("");document.querySelectorAll(".p").forEach((e,k)=>e.className="p"+(ans[k]!==null?" done":"")+(k===i?" current":""))}

function next(){if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}

function wrong(){show("wrong");let out="<h3>Wrong / Skipped Questions</h3>";ans.forEach((v,n)=>{if(v===null||v!==qs[n][2])out+="<div class='wrongbox'><b>Q"+(n+1)+".</b> "+qs[n][0]+"<br><small>Correct Answer: "+String.fromCharCode(65+qs[n][2])+") "+qs[n][1][qs[n][2]]+"</small></div>"});document.getElementById("wrongView").innerHTML=out+"<p>Only questions answered incorrectly or skipped are shown.</p>"}
function notes(){show("notes");document.getElementById("notesView").innerHTML="<h3>Notes — One-Liners</h3>"+qs.map((x,n)=>"<div class='note'><b>"+(n+1)+".</b> "+x[0]+"<br><small>Answer: "+String.fromCharCode(65+x[2])+") "+x[1][x[2]]+"</small></div>").join("")}
function submitTest(){if(submitted)return;submitted=true;clearInterval(clock);let score=0,c=0,w=0,s=0;ans.forEach((v,n)=>{if(v===null)s++;else if(v===qs[n][2]){score+=3;c++}else{score--;w++}});show("result");document.getElementById("result").innerHTML="<div class='score'>"+score+"</div><p>Score</p><div class='grid2'><div class='mini'>Correct<br><b>"+c+"</b></div><div class='mini'>Wrong<br><b>"+w+"</b></div><div class='mini'>Skipped<br><b>"+s+"</b></div><div class='mini'>Total<br><b>"+qs.length+"</b></div></div>";localStorage.setItem(key,JSON.stringify(ans))}
