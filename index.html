function bilingualOption(x){
  const m=x.match(/<div class="ohi">([\s\S]*?)<\/div><div class="oen">([\s\S]*?)<\/div>/);
  if(!m)return x;
  const hi=m[1].trim(), en=m[2].trim();
  if(hi===en)return hi;
  const hn=(hi.match(/[0-9][0-9,]*(?:\.[0-9]+)?/g)||[]).join("|");
  const enN=(en.match(/[0-9][0-9,]*(?:\.[0-9]+)?/g)||[]).join("|");
  if(hn && hn===enN){
    const units=[["करोड़","crore"],["प्रतिशत","percent"],["लाख","lakh"],["वर्ष","year"]];
    for(const u of units){
      if(hi.endsWith(u[0]) && en.toLowerCase().endsWith(u[1])) return hi+" / "+u[1];
    }
    return hi+" / "+en;
  }
  return '<div class="ohi">'+hi+'</div><div class="oen">'+en+'</div>';
}
function render(){document.getElementById("counter").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("pct").textContent=Math.round((i+1)/qs.length*100)+"%";document.getElementById("question").innerHTML=qs[i][0];document.getElementById("options").innerHTML=qs[i][1].map((x,j)=>{x=bilingualOption(x);let cls="opt";if(ans[i]!==null){if(j===qs[i][2])cls+=" correct";if(j===ans[i]&&j!==qs[i][2])cls+=" wrong";if(j===ans[i])cls+=" selected"}else if(ans[i]===j)cls+=" selected";return '<button class="'+cls+'" onclick="pick('+j+')" '+(ans[i]!==null?"disabled":"")+'>'+String.fromCharCode(65+j)+". "+x+'</button>'}).join("");document.getElementById("palette").innerHTML=qs.map((_,j)=>'<button class="p '+(ans[j]!=null?'done ':'')+(j===i?'current':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join("")}
function pick(j){if(submitted||stopped||ans[i]!==null)return;ans[i]=j;render();showFeedback(j);if(i<qs.length-1){feedbackTimer=setTimeout(next,900)}else{feedbackTimer=setTimeout(()=>showFeedback(j,true),900)}}
function showFeedback(j,last=false){const f=document.getElementById("feedback");const correct=qs[i][2];f.classList.remove("hidden");f.innerHTML=j===correct?'<b style="color:#137333">✓ Correct Answer</b>':'<b style="color:#b3261e">✗ Incorrect</b><br>Correct answer: <b>'+String.fromCharCode(65+correct)+". "+qs[i][1][correct]+'</b>';if(last)f.innerHTML+='<br><br><button class="btn" onclick="submitTest()">Submit Test</button>'}function next(){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function go(j){if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null}document.getElementById("feedback").classList.add("hidden");i=j;render()}
function submitTest(){if(submitted||stopped)return;if(confirm("Submit Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);submitted=true;finish()}}function stopTest(){if(stopped||submitted)return;if(confirm("Stop Test?")){if(feedbackTimer)clearTimeout(feedbackTimer);stopped=true;document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML="<h2>Test Stopped</h2><p>Test was stopped. Submit a test to save Wrong Questions.</p>";document.getElementById("quiz").classList.add("hidden")}}
function finish(){let c=0,w=0,b=0;ans.forEach((x,j)=>x==null?b++:x===qs[j][2]?c++:w++);let score=c*3-w;let h=JSON.parse(localStorage.getItem("mppsc_iq_history")||"[]");h.unshift({date:new Date().toLocaleString(),score,c,w,b});localStorage.setItem("mppsc_iq_history",JSON.stringify(h.slice(0,20)));let wrongIds=ans.map((x,j)=>x!=null&&x!==qs[j][2]?j:null).filter(x=>x!==null);localStorage.setItem("mppsc_iq_wrong",JSON.stringify(wrongIds));document.getElementById("quiz").classList.add("hidden");document.getElementById("feedback").classList.add("hidden");const r=document.getElementById("result");r.classList.remove("hidden");r.innerHTML='<h2>Test Submitted</h2><div class="score">'+score+' Marks</div><div class="grid2"><div class="mini">Correct<br><b>'+c+'</b></div><div class="mini">Wrong<br><b>'+w+'</b></div><div class="mini">Skipped<br><b>'+b+'</b></div><div class="mini">Total Questions<br><b>'+qs.length+'</b></div></div><p><b>Score = (Correct × 3) − Wrong</b></p>'}
function show(x){quiz.classList.remove("hidden");result.classList.add("hidden");historyView.classList.add("hidden");wrongView.classList.add("hidden")}function history(){quiz.classList.add("hidden");result.classList.add("hidden");wrongView.classList.add("hidden");historyView.classList.remove("hidden");let h=JSON.parse(localStorage.getItem("mppsc_iq_history")||"[]");historyView.innerHTML="<h2>Test History</h2>"+(h.length?h.map(x=>'<div class="mini" style="text-align:left">'+x.date+" — Score "+x.score+" | Correct "+x.c+" | Wrong "+x.w+" | Skipped "+x.b+"</div>").join(""):"<p>No submitted tests.</p>")}function wrong(){quiz.classList.add("hidden");result.classList.add("hidden");historyView.classList.add("hidden");wrongView.classList.remove("hidden");let ids=JSON.parse(localStorage.getItem("mppsc_iq_wrong")||"[]");wrongView.innerHTML="<h2>Wrong Questions</h2>"+(ids.length?ids.map(j=>'<div class="wrong"><b>Q'+(j+1)+'.</b> '+qs[j][0]+'<br><small>Correct answer: '+qs[j][1][qs[j][2]]+'</small></div>').join(""):"<p>Wrong Questions is empty until a test is submitted.</p>")}
setInterval(()=>{if(sec>0&&!submitted&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!submitted&&!stopped){submitted=true;finish()}},1000);
render();try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script></body></html>
