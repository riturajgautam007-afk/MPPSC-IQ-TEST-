<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><title>MPPSC IQ TEST 01</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}header{background:#0b1f3a;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.85}.wrap{max-width:760px;margin:auto;padding:10px 12px 30px}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 3px 14px #00000010}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#eef3f9;border-radius:10px;text-align:center;padding:9px;font-size:12px}.stat b{display:block;font-size:17px;margin-top:3px}.timer{color:#9b1c1c}.qtop{display:flex;justify-content:space-between;gap:8px;font-weight:700}.q{font-size:18px;line-height:1.55;margin:12px 0}.en{font-size:14px;color:#667085;margin-top:-7px}.opt{width:100%;padding:13px 12px;margin:6px 0;border:1px solid #d7deea;border-radius:10px;background:#fff;text-align:left;font-size:15px}.opt.selected{border:2px solid #0b1f3a;background:#edf3fb}.nav{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#0b1f3a;color:#fff;font-weight:700}.btn.alt{background:#e9eef5;color:#172033}.btn.stop{background:#8d1d1d}.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.p{aspect-ratio:1;border:0;border-radius:7px;background:#e7ecf3}.p.done{background:#0b1f3a;color:#fff}.p.current{outline:2px solid #c69b3c}.result h2{margin:4px 0 12px}.score{font-size:32px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f1f4f8;padding:10px;border-radius:9px;text-align:center}.hidden{display:none}.wrong{border-left:4px solid #9b1c1c;padding:10px;background:#fff5f5;margin:7px 0}.notice{font-size:12px;color:#667085}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;padding:9px 12px;border:0;border-radius:9px;background:#e7ecf3}.tab.active{background:#0b1f3a;color:#fff}
</style></head>
<body><header><h1>MPPSC IQ TEST 01</h1><small>Prelims 2027 • MPPSC IQ</small></header>
<div class="wrap">
<div class="card"><div class="stats"><div class="stat">कुल प्रश्न<b id="total"></b></div><div class="stat">समय<b class="timer" id="timer">30:00</b></div><div class="stat">मार्किंग<b>+3 / −1 / 0</b></div></div></div>
<div class="card"><div class="tabs"><button class="tab active" id="quizTab" onclick="showQuiz()">Test</button><button class="tab" onclick="showHistory()">History</button><button class="tab" onclick="showWrong()">Wrong Questions</button></div></div>
<section id="quizView">
<div class="card"><div class="qtop"><span id="counter"></span><span id="progress"></span></div><div class="q" id="question"></div><div class="en" id="english"></div><div id="options"></div><div class="nav"><button class="btn alt" onclick="prev()">← पिछला</button><button class="btn" onclick="next()">अगला →</button></div></div>
<div class="card"><b>Question Palette</b><div class="palette" id="palette"></div><div class="nav"><button class="btn stop" onclick="stopTest()">⏹ Test रोकें</button><button class="btn" onclick="submitTest()">Submit Test</button></div></div>
</section>
<section id="resultView" class="card result hidden"></section>
<section id="historyView" class="card hidden"></section>
<section id="wrongView" class="card hidden"></section>
</div>
<script>
const qs=[
{q:"मध्यप्रदेश की राजधानी कौन-सी है?",e:"What is the capital of Madhya Pradesh?",o:["इंदौर","भोपाल","जबलपुर","ग्वालियर"],a:1},
{q:"भारत का संविधान कब लागू हुआ?",e:"When did the Constitution of India come into force?",o:["15 अगस्त 1947","26 नवंबर 1949","26 जनवरी 1950","2 अक्टूबर 1950"],a:2},
{q:"नर्मदा नदी का उद्गम कहाँ से होता है?",e:"Where does the Narmada River originate?",o:["अमरकंटक","पचमढ़ी","मांडू","शिवपुरी"],a:0},
{q:"मौर्य साम्राज्य के संस्थापक कौन थे?",e:"Who founded the Mauryan Empire?",o:["अशोक","बिंदुसार","चंद्रगुप्त मौर्य","समुद्रगुप्त"],a:2},
{q:"पंचायती राज संस्थाओं को संवैधानिक दर्जा किस संशोधन से मिला?",e:"Which amendment gave constitutional status to Panchayati Raj institutions?",o:["42वां","44वां","73वां","74वां"],a:2},
{q:"सांची स्तूप मध्यप्रदेश के किस जिले में स्थित है?",e:"Sanchi Stupa is located in which district of Madhya Pradesh?",o:["रायसेन","विदिशा","भोपाल","सीहोर"],a:0},
{q:"भारतीय संविधान में मौलिक अधिकार किस भाग में हैं?",e:"Fundamental Rights are contained in which Part of the Constitution?",o:["भाग II","भाग III","भाग IV","भाग V"],a:1},
{q:"लोकसभा का सामान्य कार्यकाल कितना है?",e:"What is the normal term of the Lok Sabha?",o:["4 वर्ष","5 वर्ष","6 वर्ष","7 वर्ष"],a:1},
{q:"हरित क्रांति मुख्यतः किससे संबंधित है?",e:"The Green Revolution is mainly associated with:",o:["दुग्ध उत्पादन","खाद्यान्न उत्पादन","मत्स्य उत्पादन","वन उत्पादन"],a:1},
{q:"मध्यप्रदेश का राज्य पशु कौन-सा है?",e:"What is the state animal of Madhya Pradesh?",o:["बाघ","बारहसिंगा","चीतल","गौर"],a:1}
];
let i=0,ans=Array(qs.length).fill(null),sec=1800,submitted=false,stopped=false;
total.textContent=qs.length;
function render(){counter.textContent="प्रश्न "+(i+1)+" / "+qs.length;progress.textContent=Math.round((i+1)/qs.length*100)+"%";question.textContent=qs[i].q;english.textContent=qs[i].e;options.innerHTML=qs[i].o.map((x,j)=>'<button class="opt '+(ans[i]===j?'selected':'')+'" onclick="pick('+j+')">'+String.fromCharCode(65+j)+". "+x+'</button>').join("");palette.innerHTML=qs.map((_,j)=>'<button class="p '+(ans[j]!=null?'done ':'')+(i===j?'current':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join("")}
function pick(j){if(submitted||stopped)return;ans[i]=j;render();if(i<qs.length-1)setTimeout(next,220)}
function next(){if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function go(j){i=j;render()}
function saveHistory(score,c,w,b){let h=JSON.parse(localStorage.getItem("mppsc_iq_history")||"[]");h.unshift({date:new Date().toLocaleString("hi-IN"),score,c,w,b});localStorage.setItem("mppsc_iq_history",JSON.stringify(h.slice(0,20)))}
function submitTest(){if(submitted)return;if(!confirm("क्या आप टेस्ट Submit करना चाहते हैं?"))return;submitted=true;finish()}
function stopTest(){if(stopped||submitted)return;if(!confirm("टेस्ट रोकें? बाद में इसी session में जारी नहीं किया जाएगा।"))return;stopped=true;showResult("टेस्ट रोक दिया गया।")}
function finish(){let c=0,w=0,b=0;ans.forEach((x,j)=>x==null?b++:x===qs[j].a?c++:w++);let score=c*3-w;saveHistory(score,c,w,b);showResult("Test Submitted",c,w,b,score);localStorage.setItem("mppsc_iq_wrong_"+Date.now(),JSON.stringify(ans.map((x,j)=>x!=null&&x!==qs[j].a?j:null).filter(x=>x!==null)))}
function showResult(title,c=0,w=0,b=0,score=0){quizView.classList.add("hidden");resultView.classList.remove("hidden");resultView.innerHTML='<h2>'+title+'</h2><div class="score">'+score+' Marks</div><div class="grid2"><div class="mini">सही<br><b>'+c+'</b></div><div class="mini">गलत<br><b>'+w+'</b></div><div class="mini">छोड़े<br><b>'+b+'</b></div><div class="mini">कुल<br><b>'+qs.length+'</b></div></div><p class="notice">Wrong Questions में केवल Submit किए गए गलत प्रश्न सेव होते हैं।</p>'}
function showQuiz(){hideAll();quizView.classList.remove("hidden");render()}function hideAll(){[quizView,resultView,historyView,wrongView].forEach(x=>x.classList.add("hidden"))}
function showHistory(){hideAll();historyView.classList.remove("hidden");let h=JSON.parse(localStorage.getItem("mppsc_iq_history")||"[]");historyView.innerHTML="<h2>Test History</h2>"+(h.length?h.map(x=>'<div class="mini" style="margin:6px 0;text-align:left">'+x.date+' — Score <b>'+x.score+'</b> | सही '+x.c+' | गलत '+x.w+' | छोड़े '+x.b+'</div>').join(""):"<p>अभी कोई submitted test नहीं है।</p>")}
function showWrong(){hideAll();wrongView.classList.remove("hidden");let keys=Object.keys(localStorage).filter(k=>k.startsWith("mppsc_iq_wrong_"));let ids=[];keys.forEach(k=>{try{ids.push(...JSON.parse(localStorage.getItem(k)))}catch(e){}});ids=[...new Set(ids)];wrongView.innerHTML="<h2>Wrong Questions</h2>"+(ids.length?ids.map(j=>'<div class="wrong"><b>Q'+(j+1)+'.</b> '+qs[j].q+'<br><small>सही उत्तर: '+qs[j].o[qs[j].a]+'</small></div>').join(""):"<p>बिना test submit किए Wrong Questions खाली रहेगा।")}
setInterval(()=>{if(sec>0&&!submitted&&!stopped){sec--;timer.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else if(sec===0&&!submitted&&!stopped){submitted=true;finish()}},1000);
render();try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}
</script></body></html>
