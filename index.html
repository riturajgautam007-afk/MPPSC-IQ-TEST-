<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPPSC IQ TEST</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#0b1f3a;color:#fff;padding:18px;text-align:center}.card{max-width:720px;margin:14px auto;padding:18px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{text-align:center;background:#eef3f9;padding:10px;border-radius:10px}.box b{display:block;font-size:18px}.opt{display:block;width:100%;padding:14px;margin:9px 0;border:1px solid #d5ddea;background:white;border-radius:10px;text-align:left;font-size:16px}.selected{background:#e7eef8}.btn{padding:12px 18px;border:0;border-radius:9px;background:#0b1f3a;color:#fff;font-weight:bold}.nav{display:flex;justify-content:space-between}.palette{display:flex;flex-wrap:wrap;gap:5px}.p{width:34px;height:34px;border:0;border-radius:7px}.done{background:#0b1f3a;color:#fff}</style></head><body><header><h2>MPPSC IQ TEST</h2><div>Prelims 2027 • Telegram Mini App</div></header><div class="card"><div class="info"><div class="box">प्रश्न<b id="tot"></b></div><div class="box">समय<b id="time">30:00</b></div><div class="box">मार्किंग<b>+3 / −1</b></div></div></div><div class="card"><b id="num"></b><p id="question"></p><div id="options"></div><div class="nav"><button class="btn" onclick="prev()">← पिछला</button><button class="btn" onclick="next()">अगला →</button></div></div><div class="card"><b>Question Palette</b><div id="pal" class="palette"></div><br><button class="btn" onclick="submitTest()">Submit Test</button></div><div class="card" id="result" style="display:none"></div><script>const qs=[['मध्यप्रदेश की राजधानी कौन-सी है?',['इंदौर','भोपाल','जबलपुर','ग्वालियर'],1],['भारत का संविधान कब लागू हुआ?',['15 अगस्त 1947','26 नवंबर 1949','26 जनवरी 1950','2 अक्टूबर 1950'],2],['नर्मदा नदी का उद्गम कहाँ से होता है?',['अमरकंटक','पचमढ़ी','मांडू','शिवपुरी'],0],['मौर्य साम्राज्य के संस्थापक कौन थे?',['अशोक','बिंदुसार','चंद्रगुप्त मौर्य','समुद्रगुप्त'],2],['पंचायती राज को संवैधानिक दर्जा किस संशोधन से मिला?',['42वां','44वां','73वां','74वां'],2]];let i=0,a=Array(qs.length).fill(null),sec=1800;tot.textContent=qs.length;function render(){num.textContent='प्रश्न '+(i+1)+' / '+qs.length;question.textContent=qs[i][0];options.innerHTML=qs[i][1].map((x,j)=>'<button class="opt '+(a[i]===j?'selected':'')+'" onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');pal.innerHTML=qs.map((_,j)=>'<button class="p '+(a[j]!=null?'done':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join('')}function pick(j){a[i]=j;render();if(i<qs.length-1)setTimeout(next,250)}function next(){if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function go(j){i=j;render()}function submitTest(){let c=0,w=0;a.forEach((x,j)=>x==null?0:x===qs[j][2]?c++:w++);result.style.display='block';result.innerHTML='<h3>Test Result</h3><p>सही: '+c+' | गलत: '+w+' | छोड़े: '+(qs.length-c-w)+'</p><h2>Score: '+(c*3-w)+'</h2>'}setInterval(()=>{if(sec>0)sec--;time.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);render();if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}</script></body></html>
