<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC IQ Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:Arial,sans-serif;background:#f3f6fa;text-align:center;padding:40px;color:#172033}</style>
</head>
<body>
<h2>MPPSC IQ TEST</h2>
<p id="status">Test खोल रहा है...</p>
<script>
(function(){
  function getParam(){
    try{
      if(window.Telegram && Telegram.WebApp){
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        const d=Telegram.WebApp.initDataUnsafe||{};
        if(d.start_param) return d.start_param;
      }
    }catch(e){}
    try{
      const q=new URLSearchParams(location.search);
      return q.get("tgWebAppStartParam")||q.get("startapp")||q.get("start_param")||"";
    }catch(e){return ""}
  }
  const p=getParam();
  if(p==="test02"||p==="history02"||p==="history02v4"||p==="test02v3"){
    location.replace("test02.html");
  }else{
    location.replace("test01.html");
  }
})();
</script>
</body>
</html>
