];const qs=raw.map(x=>[x[0],x[1],x[2]]);let i=0,ans=Array(qs.length).fill(null),submitted=false,seconds=3600;const key="mppsc_iq_wrong_test08";
function save(){localStorage.setItem(key,JSON.stringify(ans))}
function render(){let q=qs[i];document.getElementById("counter").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("pct").textContent=Math.round((i+1)/qs.length*100)+"%";document.getElementById("question").innerHTML="<div style=\"white-space:pre-line\">"+q[0]+"</div>";document.getElementById("options").innerHTML=q[1].map((o,k)=>"<button class='opt "+(ans[i]===k?"selected":"")+"' onclick='pick("+k+")'>"+String.fromCharCode(65+k)+") "+o+"</button>").join("");document.querySelectorAll(".p").forEach((e,k)=>e.className="p"+(ans[k]!==null?" done":"")+(k===i?" current":""))}
function pick(k){if(submitted||qs[i][2]===null)return;ans[i]=k;save();render();const buttons=document.querySelectorAll(".opt");buttons.forEach((b,n)=>{if(n===qs[i][2])b.classList.add("correct");if(n===k&&k!==qs[i][2])b.classList.add("wrong")});if(i<qs.length-1)setTimeout(()=>{i++;render()},900)}
function next(){if(i<qs.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}
function show(x){["quiz","result","wrongView","notesView"].forEach(id=>document.getElementById(id).classList.add("hidden"));document.getElementById(x==="quiz"?"quiz":x==="wrong"?"wrongView":x==="notes"?"notesView":"result").classList.remove("hidden")}
function wrong(){show("wrong");let out="<h3>Wrong / Skipped Questions</h3>";ans.forEach((v,n)=>{if(v===null||v!==qs[n][2])out+="<div class='wrongbox'><b>Q"+(n+1)+".</b> "+qs[n][0]+"<br><small>Correct Answer: "+String.fromCharCode(65+qs[n][2])+") "+qs[n][1][qs[n][2]]+"</small></div>"});document.getElementById("wrongView").innerHTML=out+"<p>Only questions answered incorrectly or skipped are shown.</p>"}
function notes(){show("notes");document.getElementById("notesView").innerHTML="<h3>Notes — Quick Revision</h3><p style='color:#53657b;margin:0 0 12px'>100 quick one-liners for fast revision.</p>"+qs.map((x,n)=>"<div class='note-card'><div class='note-q'>"+(n+1)+". "+x[0]+"</div><div class='answer-highlight'><span class='answer-label'>ANSWER</span><span class='answer-value'>"+String.fromCharCode(65+x[2])+") "+x[1][x[2]]+"</span></div></div>").join("")}
function submitTest(){if(submitted)return;submitted=true;clearInterval(clock);let score=0,c=0,w=0,s=0;ans.forEach((v,n)=>{if(v===null)s++;else if(v===qs[n][2]){score+=3;c++}else{score--;w++}});show("result");document.getElementById("result").innerHTML="<div class='score'>"+score+"</div><p>Score</p><div class='grid2'><div class='mini'>Correct<br><b>"+c+"</b></div><div class='mini'>Wrong<br><b>"+w+"</b></div><div class='mini'>Skipped<br><b>"+s+"</b></div><div class='mini'>Total<br><b>"+qs.length+"</b></div></div>";localStorage.setItem(key,JSON.stringify(ans))}
function stopTest(){clearInterval(clock);alert("Test stopped. Progress saved.");save()}
function tick(){seconds--;if(seconds<=0){submitTest();return}let m=Math.floor(seconds/60),s=seconds%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
for(let n=0;n<qs.length;n++){let b=document.createElement("button");b.className="p";b.textContent=n+1;b.onclick=()=>{i=n;show("quiz");render()};document.getElementById("palette").appendChild(b)}render();let clock=setInterval(tick,1000);if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script></body></html>
