<style>
:root{--blue:#17365d;--line:#d9dee7;--green:#eaf7ee;--ink:#222}

.eyebrow{font-size:10px;color:#ffdf91;font-weight:bold}

.summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11px;border:1px solid #ffffff70;padding:4px 8px;border-radius:4px;color:#fff}
.wrap{max-width:800px;margin:auto;padding:10px 10px 24px}
.tools{display:flex;gap:7px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:4}
.search{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:6px;padding:10px;font:inherit;font-size:14px}

.meta{display:flex;justify-content:space-between;gap:6px;padding:4px 2px 10px;color:#555;font-size:12px}
.meta b{color:#17365d}
.question{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:9px;break-inside:avoid}
.qhead{display:flex;gap:8px;align-items:flex-start}
.qnum{flex:none;background:#edf2f7;color:#17365d;font-size:12px;font-weight:bold;padding:3px 6px;border-radius:4px}
.qtext{font-size:15px;font-weight:bold;line-height:1.6;margin:0;flex:1}
.options{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0}
.option{display:flex;gap:6px;align-items:flex-start;font-size:14px;color:#333;padding:2px 0}
.letter{font-weight:bold;color:#17365d;min-width:22px}
.answer{display:flex;gap:7px;align-items:flex-start;background:var(--green);border:1px solid #b9dfc5;border-radius:5px;padding:8px 9px;color:#14532d;font-size:14px;font-weight:bold}

];
const letters=["A","B","C","D"];
const list=document.getElementById('list');
function draw(filter=''){
 list.innerHTML='';let shown=0;
 questions.forEach((q,i)=>{
  const hay=(q[0]+' '+q[1].join(' ')+' '+q[3]).toLocaleLowerCase('hi');
  if(filter && !hay.includes(filter.toLocaleLowerCase('hi')))return;
  shown++;
  const card=document.createElement('article');card.className='question';
  const head=document.createElement('div');head.className='qhead';
  const num=document.createElement('span');num.className='qnum';num.textContent='प्रश्न '+(i+1);
  const title=document.createElement('p');title.className='qtext';title.textContent=q[0];
  head.append(num,title);card.appendChild(head);
  const opts=document.createElement('div');opts.className='options';
  q[1].forEach((text,j)=>{const item=document.createElement('div');item.className='option';const l=document.createElement('span');l.className='letter';l.textContent='('+letters[j]+')';const t=document.createElement('span');t.textContent=text;item.append(l,t);opts.appendChild(item)});
  card.appendChild(opts);
  const answer=document.createElement('div');answer.className='answer';
  const mark=document.createElement('span');mark.className='answer-mark';mark.textContent='✓';
  const answerText=document.createElement('span');answerText.textContent='उत्तर — ('+q[2]+') '+q[3];
  answer.append(mark,answerText);card.appendChild(answer);list.appendChild(card);
 });
 document.getElementById('count').textContent=shown;
 if(!shown){const e=document.createElement('div');e.className='empty';e.textContent='इस खोज से संबंधित कोई प्रश्न नहीं मिला।';list.appendChild(e)}
}
document.getElementById('search').addEventListener('input',e=>draw(e.target.value.trim()));
draw();
if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}
</script>
