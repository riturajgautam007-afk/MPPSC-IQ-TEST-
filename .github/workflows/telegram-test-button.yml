name: Send MPPSC IQ Notes Button

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat/channel ID"
        required: true
        type: string
      message:
        description: "Message to send"
        required: false
        default: "📚 REVISION | MP HISTORY | MCQs\n\nप्रागैतिहासिक एवं आद्य ऐतिहासिक मध्यप्रदेश\n\nनीचे दिए बटन से 100 MCQs देखें 👇"
        type: string

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          payload=$(python3 - <<'PY'
          import json, os

          print(json.dumps({
              "chat_id": os.environ["CHAT_ID"],
              "text": os.environ["MESSAGE"],
              "parse_mode": "HTML",
              "reply_markup": {
                  "inline_keyboard": [[
                      {
                          "text": "REVISION | MP HISTORY | MCQs",
                          "url": "https://riturajgautam007-afk.github.io/MPPSC-IQ-TEST-/unit01-mp-history-revision-mcqs-01-100.html?v=4"
                      }
                  ]]
              }
          }, ensure_ascii=False))
          PY
          )

          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "$payload"
