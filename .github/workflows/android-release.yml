name: Build MPPSC IQ Signed Release AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MPPSC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mppsc-iq-release.jks"

      - name: Build signed release AAB
        env:
          MPPSC_KEYSTORE_FILE: ${{ runner.temp }}/mppsc-iq-release.jks
          MPPSC_KEYSTORE_PASSWORD: ${{ secrets.MPPSC_KEYSTORE_PASSWORD }}
          MPPSC_KEY_ALIAS: ${{ secrets.MPPSC_KEY_ALIAS }}
          MPPSC_KEY_PASSWORD: ${{ secrets.MPPSC_KEY_PASSWORD }}
        run: |
          test -n "$MPPSC_KEYSTORE_PASSWORD"
          test -n "$MPPSC_KEY_ALIAS"
          test -n "$MPPSC_KEY_PASSWORD"
          gradle --no-daemon --stacktrace bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: mppsc-iq-release-aab-signed
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
